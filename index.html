<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Suivi neutre de la présidentielle 2027 : candidats, positions sourcées par thème, citations, calendrier et quiz.">
<title>Présidentielle 2027 : positions, actualité et déclarations des candidats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Layout : bandeau tricolore, barre collante, accueil illustré en deux colonnes, contenu pleine largeur */
/* Thème volontairement clair et unique : bleu, blanc, rouge sur fond très légèrement bleuté */
:root{
  --paper:#F6F8FC; --surface:#FFFFFF; --ink:#14213D; --muted:#56637E; --rule:#DCE3EF;
  --bleu:#1B3F8F; --bleu-soft:#E8EEFA; --rouge:#D7263D; --rouge-soft:#FCE9EC;
  --stamp:var(--bleu); --stamp-soft:var(--bleu-soft);
  --tri:linear-gradient(90deg,#1B3F8F 0 33.33%,#FFFFFF 33.33% 66.66%,#D7263D 66.66%);
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-text:"Newsreader",Georgia,"Times New Roman",serif;
  --gutter:clamp(16px,2.5vw,40px);
  --radius:12px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.pc{--use:var(--c)}

html{scroll-padding-top:5rem;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 var(--f-text);min-height:100%}
a{color:var(--stamp);text-underline-offset:.18em}
a:focus-visible,button:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--stamp);outline-offset:3px}
h1,h2,h3{font-family:var(--f-ui);margin:0;text-wrap:balance}
p{margin:0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{padding-inline:var(--gutter);padding-block:2rem 4rem}
.src{white-space:normal}
.eyebrow{font:700 .78rem var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--rule)}
.top-in{position:relative;display:flex;align-items:center;gap:1.5rem;padding-inline:var(--gutter);height:4rem}
.brand{font:800 1.15rem var(--f-ui);color:var(--ink);text-decoration:none;letter-spacing:-.02em;white-space:nowrap;display:flex;align-items:center;gap:.6rem}
.brand i{display:block;width:.7rem;height:.7rem;border-radius:50%;background:linear-gradient(90deg,#C8102E 0 33%,#1AA3C6 33% 66%,#1B2E6B 66%)}
.menu{display:flex;align-items:center;gap:.25rem;margin-left:auto}
.menu > a,.menu > .dd > button{appearance:none;background:none;border:0;cursor:pointer;font:600 .98rem var(--f-ui);color:var(--muted);text-decoration:none;padding:.55rem .8rem;border-radius:8px;display:inline-flex;align-items:center;gap:.4rem}
.menu > a:hover,.menu > .dd > button:hover{color:var(--ink);background:var(--paper)}
.menu > a[aria-current="page"],.menu > .dd > button.cur{color:var(--ink)}
.menu > a[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--stamp);border-radius:0}
.caret{width:.45rem;height:.45rem;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
button[aria-expanded="true"] .caret{transform:rotate(-135deg) translateY(-2px)}
.dd{position:static}
.mega{position:absolute;right:var(--gutter);top:calc(100% + .25rem);background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:0 18px 40px -18px rgba(15,23,42,.35);padding:1.25rem;width:min(56rem,calc(100vw - 2 * var(--gutter)));display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:1.25rem}
.mega h4{margin:0 0 .5rem;font:700 .74rem var(--f-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mega ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.15rem}
.mega a{display:flex;align-items:center;gap:.5rem;padding:.3rem .4rem;margin-left:-.4rem;border-radius:6px;color:var(--ink);text-decoration:none;font:600 .92rem var(--f-ui)}
.mega a:hover{background:var(--paper)}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--use);flex:none}
.burger{display:none;margin-left:auto;appearance:none;background:none;border:1px solid var(--rule);border-radius:8px;padding:.45rem .8rem;font:600 .95rem var(--f-ui);color:var(--ink);cursor:pointer;align-items:center;gap:.5rem}
@media (max-width:820px){
  .burger{display:inline-flex}
  .menu{display:none;position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--rule);flex-direction:column;align-items:stretch;padding:.5rem var(--gutter) 1rem;max-height:calc(100vh - 4rem);overflow-y:auto;gap:0}
  .menu.open{display:flex}
  .menu > a,.menu > .dd > button{width:100%;justify-content:space-between;padding:.8rem .25rem;border-radius:0;border-bottom:1px solid var(--rule)}
  .menu > a[aria-current="page"]{box-shadow:none;color:var(--stamp)}
  .mega{position:static;width:auto;box-shadow:none;border:0;padding:.75rem 0;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr))}
}

/* Accueil */
.hero-home{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(2rem,5vw,5rem);align-items:end;padding-block:clamp(1.5rem,5vw,4rem) clamp(2rem,4vw,3rem)}
.hero-home h1{font-weight:800;font-size:clamp(2.6rem,6.5vw,5.4rem);line-height:.98;letter-spacing:-.04em;margin-top:.75rem}
.hero-home .lede{font-size:clamp(1.15rem,1.6vw,1.35rem);max-width:36rem;margin-top:1.25rem;color:var(--ink)}
.cta{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:2rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;font:700 1rem var(--f-ui);text-decoration:none;padding:.8rem 1.3rem;border-radius:999px;border:1.5px solid var(--ink);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:hover{transform:translateY(-1px)}
.faces{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:flex-end}
.faces a{text-decoration:none}
.faces .av{--s:3.4rem}
.upd{margin-top:1.25rem;font:500 .92rem var(--f-ui);color:var(--muted)}
.upd time{color:var(--ink);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-block:1px solid var(--rule)}
.stat{padding:1.25rem 1.5rem 1.25rem 0;display:flex;flex-direction:column;gap:.2rem}
.stat + .stat{padding-left:1.5rem;border-left:1px solid var(--rule)}
.stat b{font:800 clamp(1.8rem,3vw,2.4rem)/1 var(--f-ui);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{font:500 .92rem var(--f-ui);color:var(--muted)}
.section{padding-block:clamp(2.5rem,5vw,4rem) 0}
.section > h2{font-size:clamp(1.5rem,2.4vw,2rem);font-weight:800;letter-spacing:-.025em}
.section > .intro{margin-top:.5rem;color:var(--muted);max-width:44rem;font-size:1.1rem}
.why{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(1.25rem,3vw,2.5rem);margin-top:1.75rem}
.why article{display:flex;flex-direction:column;gap:.5rem;padding-top:1rem;border-top:3px solid var(--ink)}
.why h3{font-size:1.15rem;font-weight:700}
.why p{color:var(--muted);font-size:1.05rem}
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(2rem,5vw,5rem);align-items:start}
@media (max-width:900px){
  .hero-home,.split{grid-template-columns:minmax(0,1fr)}
  .faces{justify-content:flex-start}
  .why{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){padding-left:0;border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--rule)}
}

/* Mini-liste de citations sur l'accueil */
.latest{display:flex;flex-direction:column;gap:1.5rem;margin-top:1.5rem}

/* Avatars */
.av{--s:3.5rem;width:var(--s);height:var(--s);border-radius:50%;border:3px solid var(--use);background:var(--stamp-soft);background:color-mix(in srgb,var(--use) 16%,var(--surface));display:grid;place-items:center;font:800 calc(var(--s)*.34)/1 var(--f-ui);color:var(--ink);overflow:hidden;flex:none;letter-spacing:-.02em}
.av img{width:100%;height:100%;object-fit:cover;display:block}

/* Page Candidats */
.page-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:1rem 2rem;padding-block:.5rem 1.5rem}
.page-head h1{font-size:clamp(2rem,4vw,3rem);font-weight:800;letter-spacing:-.035em;line-height:1.05}
.page-head p{color:var(--muted);max-width:40rem;margin-top:.4rem}
.legend{display:flex;flex-wrap:wrap;gap:.5rem 1.25rem;font:500 .9rem var(--f-ui);color:var(--muted)}
.spec{margin-top:.5rem;display:flex;flex-direction:column}
.fam-row{display:grid;grid-template-columns:14rem minmax(0,1fr);gap:1.5rem;padding-block:1.5rem;border-top:1px solid var(--rule)}
.fam-label{display:flex;flex-direction:column;gap:.6rem}
.fam-label h2{font-size:1.1rem;font-weight:700}
.track{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;max-width:10rem}
.track i{height:5px;border-radius:2px;background:var(--rule)}
.track i.on{background:var(--ink)}
.fam-cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:1rem 2rem}
@media (max-width:700px){.fam-row{grid-template-columns:minmax(0,1fr);gap:1rem}}
.spec-ends{display:flex;justify-content:space-between;font:700 .85rem var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem}
.spec-scroll{overflow-x:auto;padding-bottom:.5rem}
.spec-bar{height:4px;border-radius:2px;background:linear-gradient(90deg,#C8102E,#E0457B 30%,#E5A800 55%,#0B5FB8 78%,#1B2E6B);margin-bottom:1rem;min-width:calc(var(--n) * 9rem)}
.spec-cols{display:grid;grid-template-columns:repeat(var(--n),minmax(9rem,1fr));gap:1.5rem}
.spec-fam{display:block;font:700 .74rem/1.3 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.9rem;min-height:2.1rem}
.spec-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.75rem}
.card{display:flex;align-items:center;gap:.75rem;text-decoration:none;color:var(--ink);padding:.6rem .7rem;margin:-.6rem -.7rem;border-radius:var(--radius)}
.card:hover{background:var(--surface)}
.card .av{--s:2.8rem;border-width:2px;font-size:.92rem}
.card .t{display:flex;flex-direction:column;min-width:0}
.card .n{font:700 1rem/1.2 var(--f-ui)}
.card .p{font:500 .82rem/1.3 var(--f-ui);color:var(--muted)}
.card .status{font-size:.8rem;margin-top:.2rem;color:var(--muted)}
.card .mark{width:.65rem;height:.65rem;border-width:1.5px}
.status{display:inline-flex;align-items:center;gap:.45rem;font:600 .9rem var(--f-ui);white-space:nowrap;color:var(--ink)}
.mark{width:.8rem;height:.8rem;border-radius:50%;border:2px solid currentColor;flex:none}
.m-declare{background:currentColor}
.m-primaire{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.m-pressenti{background:transparent}

/* Calendrier */
.cal ol{list-style:none;margin:1.5rem 0 0;padding:0 0 0 1.4rem;border-left:2px solid var(--rule)}
.cal li{position:relative;padding:0 0 1.35rem}
.cal li::before{content:"";position:absolute;left:calc(-1.4rem - 7px);top:.45rem;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--stamp)}
.cal li.big::before{background:var(--stamp)}
.cal .d{font:700 1rem var(--f-ui)}
.cal p{margin:.1rem 0 0;max-width:46rem}

/* Fiche */
.back{display:inline-flex;align-items:center;gap:.5rem;font:600 .95rem var(--f-ui);text-decoration:none;margin-bottom:1.5rem}
.back::before{content:"";width:.55rem;height:.55rem;border:solid currentColor;border-width:0 0 2px 2px;transform:rotate(45deg)}
.fiche{display:grid;grid-template-columns:minmax(16rem,22rem) minmax(0,1fr);gap:clamp(2rem,4vw,4rem);align-items:start}
.side{position:sticky;top:calc(5rem + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:1rem;padding:1.5rem;background:var(--surface);border:1px solid var(--rule);border-top:5px solid var(--use);border-radius:var(--radius)}
.side .av{--s:6rem;border-width:4px;font-size:2rem}
.cname{font-weight:800;font-size:clamp(1.8rem,3vw,2.4rem);line-height:1.05;letter-spacing:-.03em}
.cname:focus{outline:none}
.cmeta{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .75rem}
.party{font:500 .95rem var(--f-ui);color:var(--muted)}
.fam{font:600 .8rem var(--f-ui);border:1.5px solid var(--use);border-radius:999px;padding:.05rem .65rem}
.note{font:500 .92rem/1.55 var(--f-ui);color:var(--muted)}
.summary{font-size:1.08rem}
.pending{padding:.9rem 1.1rem;background:var(--stamp-soft);border-left:4px solid var(--stamp);border-radius:0 8px 8px 0;font:500 .95rem/1.5 var(--f-ui);max-width:48rem;margin-bottom:1.25rem}
@media (max-width:900px){
  .fiche{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
}

.tabs{display:flex;gap:2rem;border-bottom:1px solid var(--rule);overflow-x:auto}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:.8rem 0;font:700 1.05rem var(--f-ui);color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--use)}
.panel{padding-top:1.75rem}
.panel h3{font-size:1.05rem;font-weight:700;margin:1.75rem 0 .25rem}
.state{max-width:48rem;font-size:1.08rem}
.empty{color:var(--muted);max-width:48rem;font-style:italic}
.items{list-style:none;margin:0;padding:0;max-width:52rem}
.items li{padding:1.1rem 0;border-bottom:1px solid var(--rule)}
.meta{margin-top:.45rem;display:flex;flex-wrap:wrap;gap:.2rem 1rem;font:500 .88rem/1.5 var(--f-ui);color:var(--muted)}
.theme{display:inline-block;border:1px solid var(--rule);border-radius:999px;padding:.05rem .6rem;font:600 .78rem var(--f-ui);margin-bottom:.5rem;color:var(--muted)}

/* Citations */
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1rem}
.chip{appearance:none;background:transparent;color:var(--ink);border:1.5px solid var(--rule);border-radius:999px;padding:.35rem .9rem;font:600 .88rem var(--f-ui);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.count{margin:0 0 1rem;font:500 .9rem var(--f-ui);color:var(--muted)}
.qlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,24rem),1fr));gap:1.25rem;align-items:start}
.qlist.one{grid-template-columns:minmax(0,52rem)}
.quote{margin:0;padding:1.4rem 1.5rem;background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--use);border-radius:0 var(--radius) var(--radius) 0;display:flex;flex-direction:column;gap:.6rem}
.quote .who2{display:flex;align-items:center;gap:.6rem}
.quote .who2 .av{--s:2rem;border-width:2px;font-size:.7rem}
.quote .who2 a{font:700 .95rem var(--f-ui);color:var(--ink);text-decoration:none}
.quote .theme{align-self:flex-start;margin:0}
.quote blockquote{margin:0;font:500 clamp(1.25rem,1.8vw,1.5rem)/1.35 var(--f-text)}
.quote figcaption{font:500 .88rem/1.55 var(--f-ui);color:var(--muted)}
.quote figcaption .line{display:flex;flex-wrap:wrap;gap:.2rem .6rem}
.ctx{margin-top:.35rem}

/* Carte des thèmes */
.matrix-wrap{position:relative;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
#app,#app>*{min-width:0}
.matrix{border-collapse:collapse;min-width:44rem;width:100%;font:500 .9rem var(--f-ui)}
.matrix caption{text-align:left;color:var(--muted);padding-bottom:1rem;max-width:48rem;font-size:.92rem}
.matrix th,.matrix td{padding:.55rem .4rem;border-bottom:1px solid var(--rule);text-align:center}
.matrix thead th{font-weight:700;vertical-align:bottom;font-size:.8rem;line-height:1.2;color:var(--muted)}
.matrix tbody th{text-align:left;font-weight:700;white-space:nowrap;position:sticky;left:0;background:var(--paper)}
.matrix tbody th a{display:inline-flex;align-items:center;gap:.5rem;color:var(--ink);text-decoration:none}
.matrix tbody th .av{--s:1.9rem;border-width:2px;font-size:.62rem}
.cell{display:inline-grid;place-items:center;min-width:1.9rem;height:1.9rem;border-radius:50%;border:2px solid var(--use);background:var(--stamp-soft);background:color-mix(in srgb,var(--use) 24%,var(--surface));color:var(--ink);font:800 .85rem var(--f-ui);text-decoration:none;padding:0 .15rem;font-variant-numeric:tabular-nums}

/* Méthode */
.prose{max-width:46rem;display:flex;flex-direction:column;gap:1rem;font-size:1.1rem}
.prose ul{padding-left:1.2rem;margin:0;display:flex;flex-direction:column;gap:.5rem}
.prose h2{font-size:1.3rem;font-weight:700;margin-top:1.25rem}

/* Pied de page */
.foot{margin-top:4rem;border-top:1px solid var(--rule);padding-block:1.5rem;padding-inline:var(--gutter);font:500 .88rem/1.55 var(--f-ui);color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;gap:.5rem 2rem}
.foot p{max-width:52rem}
.foot .credits{order:3;flex-basis:100%;max-width:none;font-size:.8rem}
.foot .credits a{color:inherit}

@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
/* ---------- Habillage tricolore ---------- */
.top{border-bottom:1px solid var(--rule);box-shadow:0 6px 20px -16px rgba(27,63,143,.45)}
.top::before{content:"";display:block;height:5px;background:linear-gradient(90deg,var(--bleu) 0 33.33%,#fff 33.33% 66.66%,var(--rouge) 66.66%);border-bottom:1px solid var(--rule)}
.brand{color:var(--bleu)}
.brand i{width:1.6rem;height:1.1rem;border-radius:3px;background:var(--tri);box-shadow:0 0 0 1px var(--rule)}
.menu > a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--rouge);color:var(--bleu)}
.menu > a:hover,.menu > .dd > button:hover{background:var(--bleu-soft);color:var(--bleu)}
.mega{border-top:4px solid var(--bleu)}
.mega a:hover{background:var(--bleu-soft)}

.hero-home{position:relative;margin-top:.5rem;padding:clamp(1.5rem,4vw,3.5rem);border-radius:20px;background:radial-gradient(120% 140% at 100% 0%,#DCE6FA 0%,#F3F6FD 45%,#FFFFFF 75%);border:1px solid var(--rule);overflow:hidden;align-items:center}
.hero-home::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--bleu) 0 33.33%,#fff 33.33% 66.66%,var(--rouge) 66.66%)}
.hero-home h1{color:var(--bleu)}
.hero-home h1 em{font-style:normal;color:var(--rouge)}
.eyebrow.tag{display:inline-flex;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:.35rem .8rem;color:var(--bleu)}
.eyebrow.tag i{width:1.1rem;height:.75rem;border-radius:2px;background:var(--tri);box-shadow:0 0 0 1px var(--rule)}
.illu{width:100%;height:auto;max-width:34rem;justify-self:end;display:block}
.btn.primary{background:var(--bleu);border-color:var(--bleu);color:#fff}
.btn{border-color:var(--rouge);color:var(--rouge);background:var(--surface)}
.btn:hover{box-shadow:0 8px 18px -10px rgba(27,63,143,.6)}
.faces-band{margin-top:1.75rem;display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.5rem}
.faces-band .eyebrow{color:var(--bleu)}
.faces{justify-content:flex-start;gap:.45rem}
.faces .av{--s:2.9rem;border-width:2.5px;background:var(--surface);transition:transform .15s}
.faces a:hover .av{transform:translateY(-3px)}
.stats{border:0;gap:1rem;margin-top:1.75rem}
.stat,.stat + .stat{padding:1.25rem 1.4rem;border:1px solid var(--rule);border-radius:var(--radius);background:var(--surface);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--bleu)}
.stat:nth-child(2)::before{background:linear-gradient(var(--bleu),var(--rouge))}

-je-propose-dinstaurer-des-conges-payes-climatiques", "cote": "C3"}]}, {"theme": "Économie", "kw": "Niches fossiles", "short": "Suppression progressive des niches fiscales favorables aux énergies fossiles", "text": "Le programme des Écologistes publié en juillet 2026, qu'elle porte comme candidate, prévoit de supprimer progressivement les niches fiscales qui favorisent les énergies fossiles.", "date": "Juillet 2026", "sources": [{"label": "Les Écologistes – programme « Pour une prospérité écologique » (juillet 2026)", "url": "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "cote": "A1"}]}, {"theme": "Social", "kw": "Congé climatique", "short": "Cinq jours de congés payés climatiques", "text": "Propose des congés payés climatiques de cinq jours, contre quatre en Espagne, mobilisables en cas de fortes chaleurs, d'inondations ou de fermetures d'écoles ; elle a évoqué la mesure avec la ministre espagnole du Travail Yolanda Díaz.", "date": "2026-05-01", "sources": [{"label": "Sud Radio", "url": "https://www.sudradio.fr/linvite-politique/marine-tondelier-je-propose-dinstaurer-des-conges-payes-climatiques", "cote": "C3"}, {"label": "Site de Marine Tondelier (blog)", "url": "https://marinetondelier.fr/blog/vague-chaleur-conge-climatique-yolanda-diaz", "cote": "A1"}]}, {"theme": "Social", "kw": "Alimentation", "short": "Création d'une Sécurité sociale de l'alimentation", "text": "Le programme de juillet 2026 prévoit des caisses locales de Sécurité sociale de l'alimentation ; dans son discours du 21 août, elle reprend la mesure et défend un droit à une alimentation et à une eau saines.", "date": "2026-08-21", "sources": [{"label": "Les Écologistes – programme « Pour une prospérité écologique » (juillet 2026)", "url": "https://lesecologistes.fr/document/3N4JsAEmq6vsx42IITGNZa/vdef-programme-1.pdf", "cote": "A1"}, {"label": "Site de Marine Tondelier – discours des Journées d'été", "url": "https://marinetondelier.fr/blog/discours-jde", "cote": "A oute que, selon des économistes, l'inaction coûterait cinq fois plus cher.", "source": {"label": "L'Info durable (avec AFP)", "url": "https://www.linfodurable.fr/politique/les-ecologistes-veulent-taxer-davantage-les-heritages-des-plus-fortunes-58714", "cote": "B2"}}]}, "batho": {"positions": [{"theme": "Économie", "kw": "Économie de l'utile", "short": "Sortie de la course à la croissance du PIB, économie de l'utile localisée", "text": "Dans un entretien à L'ADN, appelle à sortir de la course à la croissance du PIB et à inventer une économie de l'utile localisée, donnant la priorité à la santé et au bien-être.", "date": "2026-05-06", "sources": [{"label": "L'ADN", "url": "https://www.ladn.eu/article_shift/delphine-batho/", "cote": "C3"}]}, {"theme": "Écologie & énergie", "kw": "République terrestre", "short": "Faire de la France une « République terrestre »", "text": "Dans le même entretien, défend l'objectif de faire de la France une « République terrestre » et une écologie rassembleuse fondée sur la crédibilité plutôt que sur la peur.", "date": "2026-05-06", "sources": [{"label": "L'ADN", "url": "https://www.ladn.eu/article_shift/delphine-batho/", "cote": "C3"}]}], "quotes": [{"theme": "Économie", "date": "2026-05-06", "text": "« Nous devons inventer une économie de l'utile localisée »", "context": "Entretien à L'ADN où elle défend une rupture avec l'objectif de croissance du PIB.", "source": {"label": "L'ADN", "url": "https://www.ladn.eu/article_shift/delphine-batho/", "cote": "C3"}}, {"theme": "Écologie & énergie", "date": "2026-07-08", "text": "« faire gagner le meilleur en nous »", "context": "Formule de la candidate en présentant son essai La Politique de la beauté (éditions de l'Aube), lors d'une dédicace à Aix-en-Provence.", "source": {"label": "Gomet'", "url": "https://gomet.net/delphine-batho-generation-ecologie-faire-gagner-le-meilleur-en-nous/", "cote": "C3"}}]}, "glucksmann": {"positions": [{"theme": "Social", "kw": "Salaire net", "short": "Baisse de la es": [{"label": "LCP", "url": "https://lcp.fr/actualites/presidentielle-francois-hollande-propose-la-retraite-a-63-ans-et-dira-en-decembre-s-il", "cote": "B1"}, {"label": "Euronews", "url": "https://fr.euronews.com/my-europe/2026/09/03/presidentielle-francois-hollande-devoile-son-plan-pour-la-france-dans-un-livre-sans-se-dec", "cote": "B1"}]}, {"theme": "Social", "kw": "Pensions", "short": "Revalorisation des pensions limitée à 1 % pendant cinq ans", "text": "Propose de limiter à 1 % par an pendant cinq ans l'indexation des pensions de retraite.", "date": "2026-08-27", "sources": [{"label": "LCP", "url": "https://lcp.fr/actualites/presidentielle-francois-hollande-propose-la-retraite-a-63-ans-et-dira-en-decembre-s-il", "cote": "B1"}, {"label": "Euronews", "url": "https://fr.euronews.com/my-europe/2026/09/03/presidentielle-francois-hollande-devoile-son-plan-pour-la-france-dans-un-livre-sans-se-dec", "cote": "B1"}]}, {"theme": "Social", "kw": "Capitalisation", "short": "Une part de capitalisation gérée par les partenaires sociaux", "text": "Veut ajouter au système de retraite une part de capitalisation contrôlée par les partenaires sociaux.", "date": "2026-08-27", "sources": [{"label": "LCP", "url": "https://lcp.fr/actualites/presidentielle-francois-hollande-propose-la-retraite-a-63-ans-et-dira-en-decembre-s-il", "cote": "B1"}, {"label": "Euronews", "url": "https://fr.euronews.com/my-europe/2026/09/03/presidentielle-francois-hollande-devoile-son-plan-pour-la-france-dans-un-livre-sans-se-dec", "cote": "B1"}]}, {"theme": "Europe & international", "kw": "Autonomie européenne", "short": "Groupe de six à huit États pour les industries d'avenir", "text": "Défend l'autonomie stratégique européenne, avec un groupe de six à huit États membres pilotant les industries d'avenir, le numérique, l'intelligence artificielle et la défense.", "date": "2026-09-03", "sources": [{"label": "Euronews", "url": "https://fr.euronews.com/my-europe/2026/09/03/presidentielle-francois-hollande-devoile-son-plan-pour-la-france-dans-un-livre-sans-se-dec", "cote": "B2"}]}, {"theme": "Éducation & jeunesse", "kw": "Jeunesse", "short": "Chèque « entrée dans la vie » de 10 000 euros après un service civique", "text": "Propose un chèque « entrée dans la vie » de 10 000 euros pour les jeunes ayant effectué un service civique.", "date": "2026-09-03", "sources": [{"label": "Euronews", "url": "https://fr.euronews.com/my-europe/2026/09/03/presidentielle-francois-hollande-devoile-son-plan-pour-la-france-dans-un-livre-sans-se-dec", "cote": "B2"}]}], "quotes": [{"theme": "Social", "date": "2026-09-03", "text": "« L'âge pivot doit tenir compte de l'allongement de l'espérance de vie »", "context": "Extrait de son livre « Unir. Nouveau monde, nouvelle gauche », où il propose la retraite à 63 ans ; Olivier Faure a pris ses distances avec ces propositions.", "source": {"label": "Euronews", "url": "https://fr.euronews.com/my-europe/2026/09/03/presidentielle-francois-hollande-devoile-son-plan-pour-la-france-dans-un-livre-sans-se-dec", "cote": "B2"}}]}, "bouamrane": {"positions": [{"theme": "Économie", "kw": "Travail, normes", "short": "Valorisation du travail et allègement des normes", "text": "Dans son manifeste de candidat, Karim Bouamrane veut que « travailler paye » et annonce l'allègement des normes qui, selon lui, paralysent l'initiative et l'efficacité de l'action publique.", "date": "Manifeste 2027 (non daté, consulté le 3 octobre 2026)", "sources": [{"label": "Manifeste de Karim Bouamrane (La France humaine et forte)", "url": "https://www.lafrancehumaineetforte.fr/manifeste.html", "cote": "A1"}]}, {"theme": "Social", "kw": "Déserts médicaux", "short": "Lutte contre les déserts médicaux, préparation au vieillissement", "text": "Son manifeste prévoit l'accès à des soins de qualité quel que soit le lieu de résidence ou le revenu, la lutte contre les déserts médicaux et la préparation du système de santé au vieillissement.", "date": "Manifeste 2027 (non daté, consulté le 3 octobre 2026)", "sources": [{"label": "Manifeste de Karim Bouamrane (La France humaine et forte)", "url": "https://www.lafrancehumaineetforte.fr/manifeste.html", "cote": "A1"}]}, {"theme": "Social", "kw": "Logement", "short": "Construction, rénovation, accompagnement des ménages fragiles", "text": "Il place le logement parmi ses cinq priorités : construire, rénover et accompagner les familles, les jeunes actifs et les personnes âgées, selon le manifeste de sa campagne.", "date": "Manifeste 2027 (non daté, consulté le 3 octobre 2026)", "sources": [{"label": "Manifeste de Karim Bouamrane (La France humaine et forte)", "url": "https://www.lafrancehumaineetforte.fr/manifeste.html", "cote": "A1"}]}, {"theme": "Immigration", "kw": "Trois exigences", "short": "Accueil des ayants droit, action à la source, reconduite des irréguliers", "text": "Son manifeste fonde la politique migratoire sur trois exigences : accueillir dignement ceux qui ont le droit de rester, agir à la source par le développement et la coopération, reconduire les personnes en situation irrégulière.", "date": "Manifeste 2027 (non daté, consulté le 3 octobre 2026)", "sources": [{"label": "Manifeste de Karim Bouamrane (La France humaine et forte)", "url": "https://www.lafrancehumaineetforte.fr/manifeste.html", "cote": "A1"}]}, {"theme": "Sécurité & ordre public", "kw": "Narcotrafic", "short": "Lutte contre le narcotrafic et les points de deal", "text": "Son manifeste fait de la lutte contre le narcotrafic et les points de deal une priorité. Maire de Saint-Ouen, il a multiplié par dix les effectifs de police municipale et instauré un couvre-feu pour mineurs non accompagnés.", "date": "Manifeste 2027 (non daté, consulté le 3 octobre 2026) ; LCP, 2026-06-09", "sources": [{"label": "Manifeste de Karim Bouamrane (La France humaine et forte)", "url": "https://www.lafrancehumaineetforte.fr/manifeste.html", "cote": "A1"}, {"label": "LCP", "url": "https://lcp.fr/actualites/presidentielle-2027-qui-est-karim-bouamrane-le-maire-socialiste-de-saint-ouen-et-nouveau", "cote": "B2"}]}, {"theme": "Sécurité & ordre public", "kw": "Violences faites aux femmes et enfants", "short": "Recul des violences contre les femmes et les enfants", "text": "Le volet « Protéger » de son manifeste vise à faire reculer les violences conjugales et les violences faites aux enfants, et à protéger les personnes LGBT+ et en situation de handicap.", "date": "Manifeste 2027 (non daté, consulté le 3 octobre 2026)", "sources": [{"label": "Manifeste de Karim Bouamrane (La France humaine et forte)", "url": "https://www.lafrancehumaineetforte.fr/manifeste.html", "cote": "A1"}]}, {"theme": "Institutions & laïcité", "kw": "Laïcité", "short": "Laïcité défendue « sans compromis et sans instrumentalisation »", "text": "Dans son manifeste, il dit vouloir défendre la laïcité sans compromis ni instrumentalisation, et lutter à la fois contre l'antisémitisme et l'islamophobie. LCP le décrit comme proche de François Hollande et Manuel Valls sur ce sujet.", "date": "Manifeste 2027 (non daté, consulté le 3 octobre 2026) ; LCP, 2026-06-09", "sources": [{"label": "Manifeste de Karim Bouamrane (La France humaine et forte)", "url": "https://www.lafrancehumaineetforte.fr/manifeste.html", "cote": "A1"}, {"label": "LCP", "url": "https://lcp.fr/actualites/presidentielle-2027-qui-est-karim-bouamrane-le-maire-socialiste-de-saint-ouen-et-nouveau", "cote": "B2"}]}, {"theme": "Europe & international", "kw": "Europe protectrice, défense", "short": "Europe aux frontières gardées, hausse de l'effort de défense", "text": "Son manifeste défend une Europe « des peuples défendus, des frontières gardées » et annonce une augmentation de l'effort de défense national.", "date": "Manifeste 2027 (non daté, consulté le 3 octobre 2026)", "sources": [{"label": "Manifeste de Karim Bouamrane (La France humaine et forte)", "url": "https://www.lafrancehumaineetforte.fr/manifeste.html", "cote": "A1"}]}, {"theme": "Écologie & énergie", "kw": "Transition juste", "short": "Transition juste, protection des agriculteurs face aux importations", "text": "Il prône une transition écologique « juste » : rénovation des logements modestes, emplois locaux durables, et protection des agriculteurs contre des règles non exigées des producteurs étrangers, selon son manifeste.", "date": "Manifeste 2027 (non daté, consulté le 3 octobre 2026)", "sources": [{"label": "Manifeste de Karim Bouamrane (La France humaine et forte)", "url": "https://www.lafrancehumaineetforte.fr/manifeste.html", "cote": "A1"}]}, {"theme": "Éducation & jeunesse", "kw": "Formation et emploi", "short": "Formation menant à un emploi choisi pour chaque jeune", "text": "Son manifeste prévoit de donner à chaque enfant les mêmes chances et que chaque jeune accède à une formation menant à un emploi « choisi et non subi ».", "date": "Manifeste 2027 (non daté, consulté le 3 octobre 2026)", "sources": [{"label": "Manifeste de Karim Bouamrane (La France humaine et forte)", "url": "https://www.lafrancehumaineetforte.fr/manifeste.html", "cote": "A1"}]}], "quotes": []}, "cazeneuve": {"positions": [{"theme": "Économie", "kw": "Justice fiscale", "short": "Imposition accrue des plus hauts revenus et du patrimoine", "text": "Dans sa lettre aux Français du 15 juillet, il propose d'imposer davantage les plus hauts revenus et le capital, de simplifier la fiscalité et d'alléger la fiscalité sur la production.", "date": "2026-07-15", "sources": [{"label": "Lettre aux Français de Bernard Cazeneuve (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2515/attachments/original/1784151599/Auxfrancaisversionfinale1507.pdf", "cote": "A1"}]}, {"theme": "Économie", "kw": "Réindustrialisation", "short": "Plan de réindustrialisation sur dix ans", "text": "Il propose un plan de réindustrialisation sur dix ans sécurisant les filières stratégiques, avec des incitations fiscales ciblées sur la recherche et l'investissement productif.", "date": "2026-07-15", "sources": [{"label": "Lettre aux Français de Bernard Cazeneuve (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2515/attachments/original/1784151599/Auxfrancaisversionfinale1507.pdf", "cote": "A1"}, {"label": "Synthèse des mesures (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2513/attachments/original/1784135398/Synthese_mesuresVfinale.pdf", "cote": "A1"}]}, {"theme": "Économie", "kw": "Dette", "short": "Stabilisation rapide des finances publiques", "text": "Il rappelle une dette à 117,5 % du PIB et juge nécessaire de stabiliser rapidement les finances publiques, la charge des intérêts dépassant selon lui les budgets de la Défense et de l'Éducation.", "date": "2026-07-15", "sources": [{"label": "Lettre aux Français de Bernard Cazeneuve (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2515/attachments/original/1784151599/Auxfrancaisversionfinale1507.pdf", "cote": "A1"}, {"label": "LCP", "url": "https://lcp.fr/actualites/presidentielle-2027-pret-a-se-lancer-dans-la-course-a-l-elysee-bernard-cazeneuve-decline", "cote": "B2"}]}, {"theme": "Social", "kw": "Retraites", "short": "Durée de cotisation plutôt qu'âge légal, pénibilité rétablie", "text": "Sur les retraites, il fait de la durée de cotisation « le levier le plus juste » plutôt que l'âge légal, et propose de rétablir des critères de pénibilité et de favoriser les retraites progressives.", "date": "2026-07-15", "sources": [{"label": "Lettre aux Français de Bernard Cazeneuve (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2515/attachments/original/1784151599/Auxfrancaisversionfinale1507.pdf", "cote": "A1"}, {"label": "LCP", "url": "https://lcp.fr/actualites/presidentielle-pour-bernard-cazeneuve-lfi-n-est-pas-en-situation-de-gouverner-439773", "cote": "B2"}]}, {"theme": "Social", "kw": "Règle d'or sociale", "short": "Compensation à l'euro près des exonérations de cotisations", "text": "Il propose une « règle d'or sociale » : toute exonération de cotisations décidée par l'État compensée à l'euro près à la Sécurité sociale, et équilibre des comptes sociaux rétabli sous cinq ans.", "date": "2026-07-15", "sources": [{"label": "Lettre aux Français de Bernard Cazeneuve (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2515/attachments/original/1784151599/Auxfrancaisversionfinale1507.pdf", "cote": "A1"}, {"label": "LCP", "url": "https://lcp.fr/actualites/presidentielle-2027-pret-a-se-lancer-dans-la-course-a-l-elysee-bernard-cazeneuve-decline", "cote": "B2"}]}, {"theme": "Social", "kw": "Santé mentale", "short": "Santé mentale grande cause nationale", "text": "Sa lettre propose d'ériger la santé mentale en grande cause nationale, d'arrêter les fermetures de services de proximité et de revaloriser les soignants.", "date": "2026-07-15", "sources": [{"label": "Lettre aux Français de Bernard Cazeneuve (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2515/attachments/original/1784151599/Auxfrancaisversionfinale1507.pdf", "cote": "A1"}, {"label": "Synthèse des mesures (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2513/attachments/original/1784135398/Synthese_mesuresVfinale.pdf", "cote": "A1"}]}, {"theme": "Immigration", "kw": "Humanité, intégration, fermeté", "short": "Droit d'asile, intégration exigeante, lutte contre l'immigration irrégulière", "text": "Il fonde sa politique migratoire sur trois principes indissociables : humanité (droit d'asile), intégration (maîtrise du français, égalité femmes-hommes) et fermeté contre l'immigration irrégulière et les filières.", "date": "2026-07-15", "sources": [{"label": "Lettre aux Français de Bernard Cazeneuve (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2515/attachments/original/1784151599/Auxfrancaisversionfinale1507.pdf", "cote": "A1"}, {"label": "Synthèse des mesures (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2513/attachments/original/1784135398/Synthese_mesuresVfinale.pdf", "cote": "A1"}]}, {"theme": "Sécurité & ordre public", "kw": "Police de proximité", "short": "Police de proximité et unités spécialisées contre le narcotrafic", "text": "Il propose une police de proximité aux effectifs formés, des unités spécialisées contre le narcotrafic, le gel des avoirs et un parquet européen aux compétences élargies.", "date": "2026-07-15", "sources": [{"label": "Lettre aux Français de Bernard Cazeneuve (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2515/attachments/original/1784151599/Auxfrancaisversionfinale1507.pdf", "cote": "A1"}, {"label": "Synthèse des mesures (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2513/attachments/original/1784135398/Synthese_mesuresVfinale.pdf", "cote": "A1"}]}, {"theme": "Sécurité & ordre public", "kw": "Prison", "short": "Fin du recours systématique à la comparution immédiate et à la prison", "text": "Sa lettre propose de mettre fin au « tout-comparution immédiate » et à la prison par défaut, la surpopulation carcérale favorisant selon lui la radicalisation.", "date": "2026-07-15", "sources": [{"label": "Lettre aux Français de Bernard Cazeneuve (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2515/attachments/original/1784151599/Auxfrancaisversionfinale1507.pdf", "cote": "A1"}, {"label": "Synthèse des mesures (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2513/attachments/original/1784135398/Synthese_mesuresVfinale.pdf", "cote": "A1"}]}, {"theme": "Sécurité & ordre public", "kw": "Protection de l'enfance", "short": "Signalement national avec réponse obligatoire sous délai fixe", "text": "Pour la protection de l'enfance, il propose un cadre national unifié pour la petite enfance, un dispositif de signalement avec réponse sous délai fixe et la mobilisation de magistrats retraités.", "date": "2026-07-15", "sources": [{"label": "Lettre aux Français de Bernard Cazeneuve (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2515/attachments/original/1784151599/Auxfrancaisversionfinale1507.pdf", "cote": "A1"}, {"label": "Synthèse des mesures (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2513/attachments/original/1784135398/Synthese_mesuresVfinale.pdf", "cote": "A1"}]}, {"theme": "Institutions & laïcité", "kw": "Septennat", "short": "Rétablissement du septennat", "text": "Il propose de rétablir le septennat pour rendre au président un rôle d'arbitre, et que le Premier ministre engage systématiquement sa responsabilité devant le Parlement.", "date": "2026-07-15", "sources": [{"label": "Lettre aux Français de Bernard Cazeneuve (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2515/attachments/original/1784151599/Auxfrancaisversionfinale1507.pdf", "cote": "A1"}, {"label": "LCP", "url": "https://lcp.fr/actualites/presidentielle-pour-bernard-cazeneuve-lfi-n-est-pas-en-situation-de-gouverner-439773", "cote": "B2"}]}, {"theme": "Institutions & laïcité", "kw": "Proportionnelle, 49.3", "short": "Dose de proportionnelle et usage limité du 49.3", "text": "Sa lettre prévoit une dose de proportionnelle aux législatives et une discipline dans l'usage du 49.3, des ordonnances et des procédures accélérées.", "date": "2026-07-15", "sources": [{"label": "Lettre aux Français de Bernard Cazeneuve (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2515/attachments/original/1784151599/Auxfrancaisversionfinale1507.pdf", "cote": "A1"}, {"label": "Synthèse des mesures (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2513/attachments/original/1784135398/Synthese_mesuresVfinale.pdf", "cote": "A1"}]}, {"theme": "Institutions & laïcité", "kw": "Laïcité", "short": "Laïcité comme principe de liberté et de séparation", "text": "Il réaffirme la laïcité comme « principe de liberté et de séparation, non comme religion civile », et défend une école laïque.", "date": "2026-07-15", "sources": [{"label": "Synthèse des mesures (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2513/attachments/original/1784135398/Synthese_mesuresVfinale.pdf", "cote": "A1"}, {"label": "Lettre aux Français de Bernard Cazeneuve (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2515/attachments/original/1784151599/Auxfrancaisversionfinale1507.pdf", "cote": "A1"}]}, {"theme": "Europe & international", "kw": "Défense européenne", "short": "Défense européenne crédible, fin de l'unanimité", "text": "Il propose une défense européenne crédible, une politique industrielle commune et le passage de l'unanimité à la majorité, estimant que la France et l'Europe ne peuvent plus dépendre d'autres pour leur sécurité.", "date": "2026-07-15", "sources": [{"label": "Lettre aux Français de Bernard Cazeneuve (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2515/attachments/original/1784151599/Auxfrancaisversionfinale1507.pdf", "cote": "A1"}, {"label": "Synthèse des mesures (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2513/attachments/original/1784135398/Synthese_mesuresVfinale.pdf", "cote": "A1"}]}, {"theme": "Écologie & énergie", "kw": "Nucléaire", "short": "Maintien et renouvellement du parc nucléaire", "text": "Il assume la filière électronucléaire et un renouvellement planifié du parc, jugeant « irresponsable » de s'en passer, avec électrification des usages et sortie des énergies fossiles.", "date": "2026-07-15", "sources": [{"label": "Lettre aux Français de Bernard Cazeneuve (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2515/attachments/original/1784151599/Auxfrancaisversionfinale1507.pdf", "cote": "A1"}, {"label": "Synthèse des mesures (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2513/attachments/original/1784135398/Synthese_mesuresVfinale.pdf", "cote": "A1"}]}, {"theme": "Écologie & énergie", "kw": "Plan École-Climat", "short": "Plan décennal de rénovation des écoles et îlots de fraîcheur", "text": "Il propose un plan École-Climat-Solidarité sur dix ans (rénovation des établissements, désimperméabilisation des cours) et une « DATAR du climat » rattachée au Premier ministre.", "date": "2026-07-15", "sources": [{"label": "Lettre aux Français de Bernard Cazeneuve (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2515/attachments/original/1784151599/Auxfrancaisversionfinale1507.pdf", "cote": "A1"}, {"label": "Synthèse des mesures (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2513/attachments/original/1784135398/Synthese_mesuresVfinale.pdf", "cote": "A1"}]}, {"theme": "Éducation & jeunesse", "kw": "Avance jeunesse", "short": "Avance de 3 000 € pour les 18-24 ans sans diplôme ni emploi", "text": "Il propose une « avance jeunesse » de 3 000 euros pour les 18-24 ans sans diplôme ni emploi, sous conditions de ressources, et au moins 2 000 euros d'aide supplémentaire aux étudiants boursiers.", "date": "2026-07-15", "sources": [{"label": "Lettre aux Français de Bernard Cazeneuve (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2515/attachments/original/1784151599/Auxfrancaisversionfinale1507.pdf", "cote": "A1"}, {"label": "Synthèse des mesures (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2513/attachments/original/1784135398/Synthese_mesuresVfinale.pdf", "cote": "A1"}]}, {"theme": "Éducation & jeunesse", "kw": "Enseignants, mixité", "short": "Revalorisation des enseignants, lutte contre la ségrégation scolaire", "text": "Sa lettre prévoit des enseignants mieux formés et mieux payés, un retour aux savoirs fondamentaux et aux humanités, et la lutte contre l'« évitement organisé » entre établissements.", "date": "2026-07-15", "sources": [{"label": "Lettre aux Français de Bernard Cazeneuve (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2515/attachments/original/1784151599/Auxfrancaisversionfinale1507.pdf", "cote": "A1"}, {"label": "Synthèse des mesures (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2513/attachments/original/1784135398/Synthese_mesuresVfinale.pdf", "cote": "A1"}]}], "quotes": [{"theme": "Sécurité & ordre public", "date": "2026-07-15", "text": "« La sécurité n'est pas un thème de droite »", "context": "Dans sa lettre aux Français, il ajoute que la gauche aurait intérêt à se saisir de ce sujet.", "source": {"label": "Lettre aux Français de Bernard Cazeneuve (La Convention)", "url": "https://assets.nationbuilder.com/laconvention/pages/2515/attachments/original/1784151599/Auxfrancaisversionfinale1507.pdf", "cote": "A1"}}, {"theme": "Candidature & stratégie", "date": "2026-07-20", "text": "« Ils ne gouverneront jamais compte tenu de leurs outrances »", "context": "Sur BFMTV, à propos de La France insoumise, qu'il juge en revanche en situation d'aider le RN à accéder au pouvoir.", "source": {"label": "LCP", "url": "https://lcp.fr/actualites/presidentielle-pour-bernard-cazeneuve-lfi-n-est-pas-en-situation-de-gouverner-439773", "cote": "B2"}}, {"theme": "Candidature & stratégie", "date": "2026-05-19", "text": "« Ma volonté à être candidat est pleine et entière »", "context": "Il annonce alors présenter son projet sous quelques semaines et critique les « dégagismes » d'extrême droite et d'extrême gauche.", "source": {"label": "LCP", "url": "https://lcp.fr/actualites/presidentielle-2027-bernard-cazeneuve-fait-part-de-sa-volonte-pleine-et-entiere-d-etre", "cote": "B2"}}]}, "attal": {"positions": [{"theme": "Économie", "kw": "Déficit", "short": "Déficit sous 3 % en 2032, équilibre en 2037", "text": "Au débat du Medef du 27 août, il fixe un retour sous 3 % de déficit en 2032 et l'équilibre en 2037, la majorité des économies devant porter sur les dépenses sociales.", "date": "2026-08-27", "sources": [{"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/dette-retraites-fiscalite-que-retenir-du-premier-debat-des-candidats-a-lelection-presidentielle", "cote": "B2"}, {"label": "Acteurs publics", "url": "https://acteurspublics.fr/articles/gabriel-attal-propose-100-000-fonctionnaires-en-moins-et-limpunite-zero-pour-les-ministres-depensiers/", "cote": "B2"}]}, {"theme": "Économie", "kw": "Fonction publique", "short": "100 000 départs volontaires de fonctionnaires", "text": "Il propose 100 000 départs volontaires dans la fonction publique hors Éducation, Armées, Justice et Intérieur, et 120 à 150 milliards d'euros d'économies sans hausse d'impôts.", "date": "2026-07-02", "sources": [{"label": "Acteurs publics", "url": "https://acteurspublics.fr/articles/gabriel-attal-propose-100-000-fonctionnaires-en-moins-et-limpunite-zero-pour-les-ministres-depensiers/", "cote": "B2"}]}, {"theme": "Économie", "kw": "Responsabilité budgétaire", "short": "Départ des ministres ne tenant pas leur budget", "text": "Il propose que les ministres et directeurs d'administration qui dépassent leur budget quittent leurs fonctions, et une « année blanche » sur les prestations sociales en 2028, hors petites retraites.", "date": "2026-07-02", "sources": [{"label": "Acteurs publics", "url": "https://acteurspublics.fr/articles/gabriel-attal-propose-100-000-fonctionnaires-en-moins-et-limpunite-zero-pour-les-ministres-depensiers/", "cote": "B2"}]}, {"theme": "Social", "kw": "Salaires", "short": "« Choc des salaires » par baisse des charges salariales", "text": "Lors de son meeting du 30 mai, il annonce un « choc des salaires » visant à réduire l'écart entre salaire brut et net par une baisse des charges pesant sur les salariés.", "date": "2026-05-30", "sources": [{"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/un-an-pour-convaincre-pour-son-premier-grand-meeting-gabriel-attal-mise-sur-lespoir-et-joue-sa-difference-avec-edouard-philippe", "cote": "B2"}]}, {"theme": "Social", "kw": "Retraites", "short": "Système universel fondé sur la durée de cotisation, géré par les partenaires sociaux", "text": "Il veut confier la gestion des retraites aux partenaires sociaux et, au débat du Medef, propose un nouveau système universel fondé sur la durée de cotisation.", "date": "2026-05-30 ; 2026-08-27", "sources": [{"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/un-an-pour-convaincre-pour-son-premier-grand-meeting-gabriel-attal-mise-sur-lespoir-et-joue-sa-difference-avec-edouard-philippe", "cote": "B2"}, {"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/dette-retraites-fiscalite-que-retenir-du-premier-debat-des-candidats-a-lelection-presidentielle", "cote": "B2"}]}, {"theme": "Immigration", "kw": "Quotas de travail", "short": "Quotas d'immigration de travail votés par le Parlement", "text": "Il propose des quotas d'immigration de travail fixés et votés par le Parlement, rejetant à la fois « l'immigration zéro » et l'ouverture des frontières.", "date": "2026-05-30", "sources": [{"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/un-an-pour-convaincre-pour-son-premier-grand-meeting-gabriel-attal-mise-sur-lespoir-et-joue-sa-difference-avec-edouard-philippe", "cote": "B2"}, {"label": "Europe 1 (avec AFP)", "url": "https://www.europe1.fr/politique/gabriel-attal-veut-une-immigration-plus-faible-et-axee-sur-le-travail-938603", "cote": "B2"}]}, {"theme": "Immigration", "kw": "Regroupement familial", "short": "Allongement de la durée de séjour avant regroupement familial", "text": "Il veut une immigration plus faible et axée sur le travail, en allongeant la durée de résidence exigée avant de faire venir conjoint et enfants.", "date": "2026-05-26", "sources": [{"label": "Europe 1 (avec AFP)", "url": "https://www.europe1.fr/politique/gabriel-attal-veut-une-immigration-plus-faible-et-axee-sur-le-travail-938603", "cote": "B2"}]}, {"theme": "Sécurité & ordre public", "kw": "Crimes contre les mineurs", "short": "Parquet national dédié aux crimes contre les enfants", "text": "Après l'affaire Lyhanna, il propose un parquet national et un service de renseignement dédiés aux crimes contre les enfants, et une action engagée sous 48 heures après chaque plainte.", "date": "2026-06-12", "sources": [{"label": "Europe 1", "url": "https://www.europe1.fr/politique/affaire-lyhanna-gabriel-attal-veut-une-culture-de-lurgence-et-un-fichage-des-pedocriminels-952973", "cote": "B2"}, {"label": "Le Journal du Dimanche", "url": "https://www.lejdd.fr/politique/gabriel-attal-souhaite-aligner-le-traitement-des-pedocriminels-sur-celui-des-terroristes-176274", "cote": "B3"}]}, {"theme": "Sécurité & ordre public", "kw": "Imprescriptibilité", "short": "Imprescriptibilité des crimes sur mineurs, fichage des pédocriminels", "text": "Il propose l'imprescriptibilité des crimes sur mineurs, un fichage des pédocriminels sur le modèle des fiches S et la fin des aménagements de peine automatiques.", "date": "2026-06-12", "sources": [{"label": "Europe 1", "url": "https://www.europe1.fr/politique/affaire-lyhanna-gabriel-attal-veut-une-culture-de-lurgence-et-un-fichage-des-pedocriminels-952973", "cote": "B2"}, {"label": "Le Journal du Dimanche", "url": "https://www.lejdd.fr/politique/gabriel-attal-souhaite-aligner-le-traitement-des-pedocriminels-sur-celui-des-terroristes-176274", "cote": "B3"}]}, {"theme": "Institutions & laïcité", "kw": "Référendums", "short": "Référendums réguliers pendant le quinquennat", "text": "Il propose des « référendums réguliers » et a appelé en août à un référendum sur l'interdiction des réseaux sociaux aux moins de 15 ans après la censure du Conseil constitutionnel.", "date": "2026-05-30 ; 2026-08-15", "sources": [{"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/un-an-pour-convaincre-pour-son-premier-grand-meeting-gabriel-attal-mise-sur-lespoir-et-joue-sa-difference-avec-edouard-philippe", "cote": "B2"}, {"label": "L'Info durable (dépêche AFP)", "url": "https://www.linfodurable.fr/attal-appelle-un-referendum-sur-linterdiction-des-reseaux-aux-moins-de-15-ans-58605", "cote": "B2"}]}, {"theme": "Institutions & laïcité", "kw": "Règle d'or, décentralisation", "short": "Référendum sur une règle d'or budgétaire, maires renforcés", "text": "Il propose un référendum sur une règle d'or d'équilibre budgétaire et une nouvelle carte des collectivités faisant des maires les élus les plus puissants de France.", "date": "2026-07-02", "sources": [{"label": "Acteurs publics", "url": "https://acteurspublics.fr/articles/gabriel-attal-propose-100-000-fonctionnaires-en-moins-et-limpunite-zero-pour-les-ministres-depensiers/", "cote": "B2"}, {"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/un-an-pour-convaincre-pour-son-premier-grand-meeting-gabriel-attal-mise-sur-lespoir-et-joue-sa-difference-avec-edouard-philippe", "cote": "B2"}]}, {"theme": "Europe & international", "kw": "Ukraine", "short": "Soutien total à l'Ukraine, attachement à l'Europe", "text": "Lors de son premier meeting, il exprime son « total soutien à l'Ukraine » et rappelle son attachement à l'Europe.", "date": "2026-05-30", "sources": [{"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/un-an-pour-convaincre-pour-son-premier-grand-meeting-gabriel-attal-mise-sur-lespoir-et-joue-sa-difference-avec-edouard-philippe", "cote": "B2"}]}, {"theme": "Écologie & énergie", "kw": "Dette climatique", "short": "Résorption de la dette climatique comme de la dette publique", "text": "Il présente « deux dettes à résorber », celle des finances publiques et celle du réchauffement climatique, sans détailler de mesures chiffrées sur ce second point.", "date": "2026-05-30", "sources": [{"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/un-an-pour-convaincre-pour-son-premier-grand-meeting-gabriel-attal-mise-sur-lespoir-et-joue-sa-difference-avec-edouard-philippe", "cote": "B2"}]}, {"theme": "Éducation & jeunesse", "kw": "Effectifs", "short": "Moins de 20 élèves par classe en primaire", "text": "Il propose moins de 20 élèves par classe en primaire, une meilleure rémunération des professeurs et des AESH, et la poursuite de la lutte contre le harcèlement.", "date": "2026-05-30", "sources": [{"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/un-an-pour-convaincre-pour-son-premier-grand-meeting-gabriel-attal-mise-sur-lespoir-et-joue-sa-difference-avec-edouard-philippe", "cote": "B2"}]}, {"theme": "Éducation & jeunesse", "kw": "Blocus des lycées", "short": "Revendications à entendre, blocages et casse rejetés", "text": "Pendant les blocus de lycées, il juge qu'« il faut les entendre » mais que bloquer et casser n'apporte pas de réponse, et accuse LFI de mettre les jeunes en danger.", "date": "2026-09-30", "sources": [{"label": "Europe 1", "url": "https://www.europe1.fr/politique/blocus-des-lycees-lfi-se-sert-de-notre-jeunesse-comme-chair-a-canon-politique-juge-gabriel-attal-1113134", "cote": "B2"}]}], "quotes": [{"theme": "Immigration", "date": "2026-05-26", "text": "« Il faut que la France accueille moins pour accueillir mieux »", "context": "Il annonce porter la « préférence travail » et un durcissement du regroupement familial, quatre jours après l'officialisation de sa candidature.", "source": {"label": "Europe 1 (avec AFP)", "url": "https://www.europe1.fr/politique/gabriel-attal-veut-une-immigration-plus-faible-et-axee-sur-le-travail-938603", "cote": "B2"}}, {"theme": "Institutions & laïcité", "date": "2026-08-15", "text": "« Cela fait vingt et un ans que les Français n'ont pas été consultés directement »", "context": "Il demande un référendum sur l'interdiction des réseaux sociaux aux moins de 15 ans, après la censure du texte par le Conseil constitutionnel.", "source": {"label": "L'Info durable (dépêche AFP)", "url": "https://www.linfodurable.fr/attal-appelle-un-referendum-sur-linterdiction-des-reseaux-aux-moins-de-15-ans-58605", "cote": "B2"}}]}, "philippe": {"positions": [{"theme": "Économie", "kw": "Impôts de production", "short": "50 Md€ de baisse d'impôts de production contre 50 Md€ d'aides", "text": "Il propose 50 milliards d'euros de baisses d'impôts de production financées par 50 milliards de suppressions d'aides publiques jugées improductives, présentées au débat du Medef du 27 août.", "date": "2026-08-27", "sources": [{"label": "Site de campagne d'Édouard Philippe", "url": "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere", "cote": "A1"}, {"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/dette-retraites-fiscalite-que-retenir-du-premier-debat-des-candidats-a-lelection-presidentielle", "cote": "B2"}]}, {"theme": "Économie", "kw": "Déficit, règle d'or", "short": "Déficit à 2 % du PIB en fin de quinquennat, règle constitutionnelle", "text": "Il vise un déficit ramené de plus de 5 % à 2 % du PIB en fin de quinquennat et une règle constitutionnelle contraignant le Parlement à respecter l'équilibre budgétaire.", "date": "2026-08-27", "sources": [{"label": "Site de campagne d'Édouard Philippe", "url": "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere", "cote": "A1"}, {"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/dette-retraites-fiscalite-que-retenir-du-premier-debat-des-candidats-a-lelection-presidentielle", "cote": "B2"}]}, {"theme": "Économie", "kw": "Moratoire normatif", "short": "Moratoire normatif et fiscal pour le quinquennat", "text": "Son programme prévoit un moratoire normatif et fiscal pendant cinq ans et une réorganisation de l'État par fusion ou privatisation d'agences.", "date": "Programme de campagne (consulté le 3 octobre 2026)", "sources": [{"label": "Site de campagne d'Édouard Philippe", "url": "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere", "cote": "A1"}]}, {"theme": "Social", "kw": "Retraites", "short": "Pilier par capitalisation de 10 à 15 % des pensions", "text": "Il propose d'allonger la durée de travail en tenant compte des carrières et de créer un pilier par capitalisation représentant 10 à 15 % des pensions d'ici quinze ans, géré avec les partenaires sociaux.", "date": "Programme de campagne (consulté le 3 octobre 2026)", "sources": [{"label": "Site de campagne d'Édouard Philippe", "url": "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere", "cote": "A1"}, {"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/dette-retraites-fiscalite-que-retenir-du-premier-debat-des-candidats-a-lelection-presidentielle", "cote": "B2"}]}, {"theme": "Social", "kw": "Politique familiale", "short": "Avantage fiscal dès le deuxième enfant, aide familiale unique", "text": "Son programme prévoit un avantage fiscal dès le deuxième enfant, la fusion des aides familiales en une aide unique et universelle, et un temps partiel parental payé 80 %.", "date": "Programme de campagne (consulté le 3 octobre 2026)", "sources": [{"label": "Site de campagne d'Édouard Philippe", "url": "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-attentive-a-ses-enfants", "cote": "A1"}]}, {"theme": "Immigration", "kw": "Accord de 1968, quotas", "short": "Dénonciation de l'accord franco-algérien de 1968, quotas économiques", "text": "Son programme prévoit de dénoncer l'accord franco-algérien de 1968, de restreindre l'immigration familiale, d'instaurer des quotas pour l'immigration économique et d'expulser les étrangers délinquants.", "date": "Programme de campagne (consulté le 3 octobre 2026)", "sources": [{"label": "Site de campagne d'Édouard Philippe", "url": "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-sure", "cote": "A1"}]}, {"theme": "Immigration", "kw": "Mayotte", "short": "Suspension des demandes d'asile et moratoire migratoire à Mayotte", "text": "En visite à Mayotte, il propose de suspendre l'enregistrement des demandes d'asile et toutes les voies d'immigration pendant le quinquennat, et de suspendre le droit du sol plusieurs années.", "date": "2026-08-20", "sources": [{"label": "LCP", "url": "https://lcp.fr/actualites/mayotte-pour-edouard-philippe-l-urgence-est-de-fermer-les-vannes-de-l-immigration-440519", "cote": "B2"}]}, {"theme": "Sécurité & ordre public", "kw": "Peines", "short": "Courtes peines dès la première infraction, peines planchers", "text": "Son programme prévoit des courtes peines dissuasives dès la première infraction, des peines planchers pour les atteintes aux dépositaires de l'autorité et la suppression du juge d'application des peines.", "date": "Programme de campagne (consulté le 3 octobre 2026)", "sources": [{"label": "Site de campagne d'Édouard Philippe", "url": "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-sure", "cote": "A1"}]}, {"theme": "Sécurité & ordre public", "kw": "Narcotrafic", "short": "« État d'urgence narco » avec reconnaissance faciale ciblée", "text": "Il propose un « état d'urgence narco » autorisant notamment la reconnaissance faciale ciblée, et l'alignement du régime des grands narcotrafiquants sur celui des terroristes.", "date": "Programme de campagne (consulté le 3 octobre 2026)", "sources": [{"label": "Site de campagne d'Édouard Philippe", "url": "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-sure", "cote": "A1"}]}, {"theme": "Institutions & laïcité", "kw": "Calendrier présidentiel", "short": "Prise de fonction du président élu en septembre", "text": "Dans un podcast, il se dit favorable à ce que le président élu en mai prenne ses fonctions en septembre, une proposition critiquée par Gabriel Attal et d'autres adversaires.", "date": "2026-09-11", "sources": [{"label": "Europe 1", "url": "https://www.europe1.fr/politique/se-reposer-decompresser-edouard-philippe-souhaite-une-prise-de-fonction-du-president-en-septembre-une-proposition-qui-fait-bondir-ses-adversaires-1071254", "cote": "B2"}, {"label": "Sud Radio (dépêche AFP)", "url": "https://www.sudradio.fr/politique/presidentielle-2027-edouard-philippe-mise-sur-lunion-de-la-droite-et-du-centre", "cote": "C3"}]}, {"theme": "Europe & international", "kw": "Ukraine, OTAN", "short": "Troupes européennes en Ukraine après la paix, adhésion à l'OTAN", "text": "Reçu à Kiev par Volodymyr Zelensky, il se dit favorable au déploiement de troupes européennes en Ukraine une fois la paix revenue et à l'entrée de l'Ukraine dans l'OTAN.", "date": "2026-05-26", "sources": [{"label": "Europe 1", "url": "https://www.europe1.fr/international/candidat-a-la-prochaine-presidentielle-edouard-philippe-a-rencontre-volodymyr-zelensky-a-kiev-ce-mardi-938750", "cote": "B2"}, {"label": "Euronews", "url": "https://fr.euronews.com/my-europe/2026/05/26/edouard-philippe-a-rencontre-volodymyr-zelensky-a-kyiv", "cote": "B2"}]}, {"theme": "Europe & international", "kw": "Défense", "short": "250 000 réservistes, 50 000 volontaires par an", "text": "Son programme prévoit de porter les réservistes de 45 000 à 250 000, le service militaire volontaire à 50 000 places par an et une nouvelle loi de programmation militaire.", "date": "Programme de campagne (consulté le 3 octobre 2026)", "sources": [{"label": "Site de campagne d'Édouard Philippe", "url": "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-sure", "cote": "A1"}]}, {"theme": "Europe & international", "kw": "Concurrence chinoise", "short": "Transferts de technologie imposés dans les secteurs stratégiques", "text": "Il propose d'imposer transferts de technologie, quotas de production et coentreprises face à la concurrence chinoise dans les secteurs stratégiques, et un Buy European Tech Act.", "date": "Programme de campagne (consulté le 3 octobre 2026)", "sources": [{"label": "Site de campagne d'Édouard Philippe", "url": "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere", "cote": "A1"}, {"label": "Site de campagne d'Édouard Philippe", "url": "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-conquerante", "cote": "A1"}]}, {"theme": "Écologie & énergie", "kw": "Nucléaire, renouvelables", "short": "Relance du nucléaire, renouvelables et électrification", "text": "Son programme vise la souveraineté énergétique par la relance du nucléaire, le développement des renouvelables, l'électrification massive des usages et un prix carbone aux frontières européennes.", "date": "Programme de campagne (consulté le 3 octobre 2026)", "sources": [{"label": "Site de campagne d'Édouard Philippe", "url": "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-conquerante", "cote": "A1"}]}, {"theme": "Écologie & énergie", "kw": "Adaptation", "short": "Doublement du Fonds vert, climatisation des lieux accueillant des publics fragiles", "text": "Il propose de doubler le Fonds vert recentré sur l'adaptation des bâtiments, de climatiser les établissements accueillant des publics vulnérables et de créer une « DATAR 2.0 ».", "date": "Programme de campagne (consulté le 3 octobre 2026)", "sources": [{"label": "Site de campagne d'Édouard Philippe", "url": "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-conquerante", "cote": "A1"}]}, {"theme": "Éducation & jeunesse", "kw": "Rythmes scolaires", "short": "Journées plus courtes, vacances d'été raccourcies, enseignants revalorisés", "text": "Lors de son meeting du 5 juillet, il annonce une refonte de l'école « peut-être la plus importante depuis Jules Ferry » : journées plus courtes, vacances d'été réduites, enseignants mieux payés.", "date": "2026-07-05", "sources": [{"label": "LCP", "url": "https://lcp.fr/actualites/presidentielle-le-pari-d-edouard-philippe-pour-seduire-les-jeunes-face-a-jean-luc", "cote": "B2"}, {"label": "Site de campagne d'Édouard Philippe", "url": "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-attentive-a-ses-enfants", "cote": "A1"}]}, {"theme": "Éducation & jeunesse", "kw": "Autonomie des chefs d'établissement", "short": "Autorité des chefs d'établissement sur méthodes, horaires et uniformes", "text": "Son programme donne aux chefs d'établissement autorité sur les méthodes, les horaires, l'uniforme, la discipline et l'évaluation des personnels, et recentre le primaire sur lire, écrire, compter.", "date": "Programme de campagne (consulté le 3 octobre 2026)", "sources": [{"label": "Site de campagne d'Édouard Philippe", "url": "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-attentive-a-ses-enfants", "cote": "A1"}]}, {"theme": "Éducation & jeunesse", "kw": "Protection de l'enfance", "short": "Imprescriptibilité des crimes sur mineurs, « droit de savoir » des parents", "text": "Il propose l'imprescriptibilité des crimes contre les mineurs et un « droit de savoir » permettant aux parents de demander les antécédents des personnes encadrant leurs enfants.", "date": "Programme de campagne (consulté le 3 octobre 2026)", "sources": [{"label": "Site de campagne d'Édouard Philippe", "url": "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-attentive-a-ses-enfants", "cote": "A1"}]}], "quotes": [{"theme": "Immigration", "date": "2026-08-20", "text": "« absurde, hypocrite et dangereux pour le territoire »", "context": "À Mayotte, à propos d'un éventuel « appel d'air » migratoire, en présentant un moratoire total sur l'immigration dans l'archipel.", "source": {"label": "LCP", "url": "https://lcp.fr/actualites/mayotte-pour-edouard-philippe-l-urgence-est-de-fermer-les-vannes-de-l-immigration-440519", "cote": "B2"}}, {"theme": "Institutions & laïcité", "date": "2026-09-11", "text": "« Un, de se reposer et deux, de décompresser »", "context": "Il justifie ainsi une prise de fonction du président élu en septembre, proposition critiquée par ses concurrents.", "source": {"label": "Europe 1", "url": "https://www.europe1.fr/politique/se-reposer-decompresser-edouard-philippe-souhaite-une-prise-de-fonction-du-president-en-septembre-une-proposition-qui-fait-bondir-ses-adversaires-1071254", "cote": "B2"}}, {"theme": "Europe & international", "date": "2026-05-26", "text": "« l'armée la plus aguerrie d'Europe »", "context": "À Kiev, à propos de l'armée ukrainienne, en plaidant pour l'entrée de l'Ukraine dans l'OTAN.", "source": {"label": "Europe 1", "url": "https://www.europe1.fr/international/candidat-a-la-prochaine-presidentielle-edouard-philippe-a-rencontre-volodymyr-zelensky-a-kiev-ce-mardi-938750", "cote": "B2"}}]}, "retailleau": {"positions": [{"theme": "Économie", "kw": "Droits de succession", "short": "Baisse des droits de succession, dons défiscalisés jusqu'à 150 000 €", "text": "Promet de baisser les droits de succession, d'exonérer la transmission des entreprises familiales conservées par les héritiers et d'autoriser pendant trois ans des dons défiscalisés jusqu'à 150 000 € aux enfants de moins de 30 ans.", "date": "2026-08-26", "sources": [{"label": "Les Républicains (site officiel)", "url": "https://republicains.fr/actualites/2026/08/26/je-serai-le-president-qui-baissera-les-impots-de-succession/", "cote": "A1"}]}, {"theme": "Économie", "kw": "Normes", "short": "Suppression par ordonnance d'une centaine de normes après l'élection", "text": "Au débat de l'université d'été du Medef, s'engage à supprimer par ordonnance une centaine de normes dans les semaines suivant son élection et qualifie d'échec le double quinquennat d'Emmanuel Macron.", "date": "2026-08-27", "sources": [{"label": "LCP", "url": "https://lcp.fr/actualites/presidentielle-2027-ce-qu-il-faut-retenir-du-premier-debat-entre-les-candidats-440670", "cote": "B2"}]}, {"theme": "Économie", "kw": "Compétitivité", "short": "Choc de compétitivité et réciprocité aux frontières", "text": "Défend un choc de compétitivité par la baisse des normes, des impôts et des charges, ainsi qu'une réciprocité aux frontières interdisant l'importation de produits dont la production est interdite en France.", "date": "2026-09-16", "sources": [{"label": "Les Républicains (site officiel)", "url": "https://republicains.fr/actualites/2026/09/16/produire-en-france-la-meilleure-des-solutions-ecologiques/", "cote": "A1"}]}, {"theme": "Économie", "kw": "Temps de travail", "short": "Travailler davantage ; fin des 35 heures", "text": "Estime au débat du Medef que les Français travaillent trois semaines de moins par an que leurs voisins ; son plan de janvier 2026 prévoit 1 623 heures annuelles et des heures supplémentaires sans cotisations ni impôt (position de janvier réaffirmée).", "date": "2026-08-28", "sources": [{"label": "Euronews", "url": "https://fr.euronews.com/2026/08/28/presidentielle-de-2027-a-roland-garros-les-candidats-croisent-le-fer-sur-leconomie", "cote": "B2"}, {"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/la-fete-est-finie-bruno-retailleau-veut-supprimer-les-35-heures-inciter-a-la-reprise-dactivite-et-plafonner-les-aides-sociales-pour-relancer-lemploi", "cote": "B2"}]}, {"theme": "Social", "kw": "Retraites", "short": "Âge minimal 63 ans, taux plein 65 ans, étage de capitalisation", "text": "Propose un âge minimal de départ à 63 ans avec décote, un taux plein à 65 ans indexé sur l'espérance de vie et, pour les jeunes, un étage de capitalisation à rendement garanti financé par 1 % du salaire.", "date": "2026-09-23", "sources": [{"label": "LCP", "url": "https://lcp.fr/actualites/retraites-bruno-retailleau-veut-un-age-minimal-de-depart-a-63-ans-et-un-taux-plein-a-65", "cote": "B2"}]}, {"theme": "Social", "kw": "Aides sociales", "short": "Compte social unique plafonné à 70 % du Smic", "text": "Propose de regrouper les aides sociales dans un compte social unique plafonné à 70 % du Smic, mesure présentée en janvier 2026 et réaffirmée lors de son meeting du Parc floral puis dans sa campagne d'été.", "date": "2026-06-20", "sources": [{"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/presidentielle-jirai-jusquau-bout-de-lelection-pour-remettre-la-france-a-lendroit-clame-bruno-retailleau-a-son-premier-grand-meeting", "cote": "B1"}, {"label": "LCP", "url": "https://lcp.fr/actualites/j-irai-jusqu-au-bout-bruno-retailleau-lance-sa-conquete-de-l-elysee-devant-une-droite", "cote": "B1"}, {"label": "Les Républicains (site officiel)", "url": "https://republicains.fr/actualites/2026/08/26/je-serai-le-president-qui-baissera-les-impots-de-succession/", "cote": "A1"}]}, {"theme": "Social", "kw": "Pensions", "short": "Retour de la réforme des retraites dans le budget 2027", "text": "Demande au gouvernement de réintroduire la réforme des retraites dans le budget 2027 et refuse de voter une baisse des pensions, comme la désindexation des plus élevées ou la fin de l'abattement de 10 %.", "date": "2026-09-16", "sources": [{"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/budget-bruno-retailleau-demande-au-gouvernement-le-retour-de-la-reforme-des-retraites", "cote": "B2"}]}, {"theme": "Immigration", "kw": "Droit du sol", "short": "Suppression du droit du sol par référendum", "text": "Veut supprimer le droit du sol par référendum, après une révision constitutionnelle ouvrant l'article 11 aux questions migratoires, en citant l'exemple de Mayotte où il a déjà été restreint.", "date": "2026-09-09", "sources": [{"label": "Outremers 360 (dépêche AFP)", "url": "https://outremers360.com/bassin-atlantique-appli/bruno-retailleau-veut-supprimer-le-droit-du-sol-par-referendum", "cote": "B1"}, {"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-bruno-retailleau-propose-une-revolution-copernicienne-dans-laquelle-la-constitution-ne-serait-plus-le-bouclier-qui-prote", "cote": "B1"}]}, {"theme": "Immigration", "kw": "Schengen", "short": "Libre circulation Schengen réservée aux Européens", "text": "Propose de réserver la libre circulation dans l'espace Schengen aux citoyens européens, de créer des visas territorialisés et de conditionner aide au développement et droits de douane à la réadmission des migrants.", "date": "2026-08-02", "sources": [{"label": "Les Républicains (site officiel)", "url": "https://republicains.fr/actualites/2026/08/02/lespace-schengen-doit-etre-reserve-aux-europeens/", "cote": "A1"}]}, {"theme": "Immigration", "kw": "Immigration choisie", "short": "Immigration choisie, rejet de l'objectif d'immigration zéro", "text": "Lors de son premier grand meeting au Parc floral, se dit favorable à une immigration choisie et écarte l'objectif d'une immigration zéro.", "date": "2026-06-20", "sources": [{"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/presidentielle-jirai-jusquau-bout-de-lelection-pour-remettre-la-france-a-lendroit-clame-bruno-retailleau-a-son-premier-grand-meeting", "cote": "B2"}]}, {"theme": "Sécurité & ordre public", "kw": "Peines minimales", "short": "Peines minimales obligatoires inscrites dans une charte constitutionnelle", "text": "Propose une « charte de l'ordre républicain » à valeur constitutionnelle prévoyant des peines minimales obligatoires pour certaines infractions, soumise à référendum dès la rentrée 2027.", "date": "2026-09-03", "sources": [{"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-bruno-retailleau-propose-une-revolution-copernicienne-dans-laquelle-la-constitution-ne-serait-plus-le-bouclier-qui-prote", "cote": "B2"}]}, {"theme": "Sécurité & ordre public", "kw": "Justice pénale", "short": "Suppression du juge d'application des peines, castration chimique", "text": "Propose de supprimer le juge de l'application des peines, d'imposer la castration chimique aux auteurs de crimes pédocriminels sans leur consentement et de créer une cour de discipline des magistrats.", "date": "2026-06-20", "sources": [{"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/presidentielle-jirai-jusquau-bout-de-lelection-pour-remettre-la-france-a-lendroit-clame-bruno-retailleau-a-son-premier-grand-meeting", "cote": "B2"}]}, {"theme": "Institutions & laïcité", "kw": "Référendum", "short": "Article 11 élargi à toute question législative", "text": "Veut étendre le référendum de l'article 11 à toute question législative et, en cas de censure d'une loi par le Conseil constitutionnel, permettre un référendum ou une réunion du Parlement en Congrès pour passer outre.", "date": "2026-09-03", "sources": [{"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-bruno-retailleau-propose-une-revolution-copernicienne-dans-laquelle-la-constitution-ne-serait-plus-le-bouclier-qui-prote", "cote": "B1"}, {"label": "LCP", "url": "https://lcp.fr/actualites/j-irai-jusqu-au-bout-bruno-retailleau-lance-sa-conquete-de-l-elysee-devant-une-droite", "cote": "B1"}]}, {"theme": "Institutions & laïcité", "kw": "RIP", "short": "Seuil du RIP abaissé à 2,5 millions de signatures", "text": "Propose d'abaisser de 5 à 2,5 millions le nombre de signatures de citoyens nécessaires pour déclencher un référendum d'initiative partagée.", "date": "2026-09-03", "sources": [{"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-bruno-retailleau-propose-une-revolution-copernicienne-dans-laquelle-la-constitution-ne-serait-plus-le-bouclier-qui-prote", "cote": "B2"}]}, {"theme": "Institutions & laïcité", "kw": "Racines", "short": "Racines judéo-chrétiennes reconnues dans la Constitution", "text": "Souhaite que la charte constitutionnelle de l'ordre républicain qu'il propose reconnaisse les racines judéo-chrétiennes de la France.", "date": "2026-09-03", "sources": [{"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-bruno-retailleau-propose-une-revolution-copernicienne-dans-laquelle-la-constitution-ne-serait-plus-le-bouclier-qui-prote", "cote": "B2"}]}, {"theme": "Europe & international", "kw": "Défense", "short": "Budget militaire port
