é à 100 Md€ en fin de mandat", "text": "Propose un nouveau Livre blanc de la défense en 2027, un budget militaire de 100 milliards d'euros en fin de mandat, une réserve territorialisée et des alliances européennes moins dépendantes des États-Unis.", "date": "2026-07-14", "sources": [{"label": "Les Républicains (site officiel)", "url": "https://republicains.fr/actualites/2026/07/14/lunite-nationale-premiere-de-nos-armes/", "cote": "A1"}]}, {"theme": "Europe & international", "kw": "Droit européen", "short": "Dérogation possible au droit européen, primauté du droit national", "text": "Veut permettre à la France de déroger au droit européen dans certains cas et affirmer la primauté du droit national sur les normes internationales, par la charte constitutionnelle qu'il propose.", "date": "2026-09-03", "sources": [{"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-bruno-retailleau-propose-une-revolution-copernicienne-dans-laquelle-la-constitution-ne-serait-plus-le-bouclier-qui-prote", "cote": "B1"}, {"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/referendum-sur-limmigration-primaute-du-droit-national-le-projet-de-bruno-retailleau-est-il-faisable", "cote": "B1"}]}, {"theme": "Europe & international", "kw": "Ukraine", "short": "Déplacement à Kiev, premier voyage de campagne à l'étranger", "text": "Se rend à Kiev en mai 2026 ; son équipe présente ce déplacement comme son premier voyage de campagne à l'étranger, l'Ukraine étant jugée centrale dans les enjeux de défense de 2027.", "date": "Mai 2026", "sources": [{"label": "Europe 1", "url": "https://www.europe1.fr/politique/deplacement-dedouard-philippe-a-kiev-un-passage-oblige-pour-les-candidats-a-la-presidentielle-de-la-droite-et-du-camp-central-939020", "cote": "B2"}]}, {"theme": "Écologie & énergie", "kw": "Adaptation", "short": "Adaptation climatique, nucléaire, fin des subventions aux renouvelables", "text": "Défend une politique climatique fondée sur l'adaptation : stockage de l'eau, climatisation des écoles et hôpitaux, développement du nucléaire et fin des subventions aux énergies renouvelables.", "date": "2026-08-09", "sources": [{"label": "Les Républicains (site officiel)", "url": "https://republicains.fr/actualites/2026/08/09/face-au-rechauffement-climatique-adapter-la-france-plutot-que-punir/", "cote": "A1"}]}, {"theme": "Écologie & énergie", "kw": "Précaution", "short": "Principe de précaution supprimé de la Constitution", "text": "Veut supprimer le principe de précaution au profit d'un principe de responsabilité et inscrire l'agriculture comme intérêt fondamental de la nation dans la Constitution.", "date": "2026-09-16", "sources": [{"label": "Les Républicains (site officiel)", "url": "https://republicains.fr/actualites/2026/09/16/produire-en-france-la-meilleure-des-solutions-ecologiques/", "cote": "A1"}]}, {"theme": "Éducation & jeunesse", "kw": "Transmission", "short": "Examen d'entrée en 6e, groupes de niveau, fin du passage automatique", "text": "Propose un examen d'entrée en sixième, des groupes de niveau, des dispositifs de rattrapage et la fin du passage automatique en classe supérieure.", "date": "2026-08-31", "sources": [{"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-bruno-retailleau-veut-refonder-lecole-autour-de-quatre-axes-principaux", "cote": "B2"}]}, {"theme": "Éducation & jeunesse", "kw": "Autonomie", "short": "1 000 écoles publiques libres", "text": "Veut créer 1 000 écoles publiques libres, sur la base du volontariat, pouvant adapter programmes, rythmes et vacances, et donner plus d'autonomie aux établissements.", "date": "2026-08-31", "sources": [{"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-bruno-retailleau-veut-refonder-lecole-autour-de-quatre-axes-principaux", "cote": "B2"}]}, {"theme": "Éducation & jeunesse", "kw": "Enseignants", "short": "Salaires des enseignants rapprochés de la moyenne européenne", "text": "Propose d'augmenter nettement la rémunération des enseignants pour la rapprocher de la moyenne européenne et de revoir une progression de carrière fondée sur l'ancienneté.", "date": "2026-08-31", "sources": [{"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-bruno-retailleau-veut-refonder-lecole-autour-de-quatre-axes-principaux", "cote": "B2"}]}, {"theme": "Éducation & jeunesse", "kw": "Autorité", "short": "Structures de réintégration scolaire, contrat d'engagement parental", "text": "Veut renforcer les pouvoirs des chefs d'établissement et des conseils de discipline, créer des structures de réintégration pour les moins de 16 ans exclus et un contrat d'engagement parental.", "date": "2026-08-31", "sources": [{"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/presidentielle-2027-bruno-retailleau-veut-refonder-lecole-autour-de-quatre-axes-principaux", "cote": "B2"}]}], "quotes": [{"theme": "Immigration", "date": "2026-09-09", "text": "« On ne peut pas devenir français par hasard, en catimini, de façon automatique. »", "context": "En annonçant vouloir supprimer le droit du sol par référendum, il qualifie aussi l'immigration de charge pour la France, selon la dépêche AFP.", "source": {"label": "Outremers 360 (dépêche AFP)", "url": "https://outremers360.com/bassin-atlantique-appli/bruno-retailleau-veut-supprimer-le-droit-du-sol-par-referendum", "cote": "B3"}}, {"theme": "Sécurité & ordre public", "date": "2026-06-20", "text": "« Tu casses et tu répares, cette menace-là, c'est pour gronder les enfants »", "context": "Lors de son premier grand meeting au Parc floral, il critique la politique pénale actuelle et propose de supprimer le juge de l'application des peines.", "source": {"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/presidentielle-jirai-jusquau-bout-de-lelection-pour-remettre-la-france-a-lendroit-clame-bruno-retailleau-a-son-premier-grand-meeting", "cote": "B2"}}, {"theme": "Europe & international", "date": "2026-08-02", "text": "« Un pays ne peut pas faire subir ses choix laxistes à tous les autres. »", "context": "Dans un texte publié par Les Républicains, il demande que la libre circulation dans l'espace Schengen soit réservée aux citoyens européens.", "source": {"label": "Les Républicains (site officiel)", "url": "https://republicains.fr/actualites/2026/08/02/lespace-schengen-doit-etre-reserve-aux-europeens/", "cote": "A1"}}]}, "lisnard": {"positions": [{"theme": "Économie", "kw": "Dépense publique", "short": "Baisse massive de la dépense publique plutôt que hausse d'impôts", "text": "Aux assises de l'AFER, privilégie une forte baisse de la dépense publique plutôt que des hausses d'impôts, refuse toute nouvelle taxation de l'épargne et s'engage à ne pas modifier la fiscalité de l'assurance-vie.", "date": "2026-09-29", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://unenouvelleenergie.fr/david-lisnard-aux-assises-de-lafer---tre-propritaire-cest-tre-libre-et-responsable-", "cote": "A1"}]}, {"theme": "Économie", "kw": "Coût du travail", "short": "Cotiser moins pour gagner plus ; impôts de production réduits", "text": "Lors de son meeting de Benfeld, veut réduire l'écart entre le coût total du travail et le salaire net et baisser les impôts de production, en déréglementant et en décentralisant.", "date": "2026-09-25", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://www.unenouvelleenergie.fr/-benfeld-david-lisnard-appelle---librer-le-pays--devant-plus-de-1-200-personnes/", "cote": "A1"}]}, {"theme": "Économie", "kw": "Dette", "short": "Baisses d'impôts non financées par la dette", "text": "Sur LCI, à propos de la crise de la pêche, estime que l'État n'a plus de marges et que les baisses d'impôts ne doivent pas être financées par la dette mais par la réduction de la dépense publique.", "date": "2026-09-18", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://www.unenouvelleenergie.fr/il-faut-rtablir-les-conditions-de-la-rentabilit-de-la-pche-franaise/", "cote": "A1"}]}, {"theme": "Économie", "kw": "Règle d'or", "short": "Dépenses publiques sous 50 % du PIB, règle d'or", "text": "Son programme vise des dépenses publiques sous 50 % du PIB en dix ans, une règle d'or limitant le déficit structurel hors investissement et la réaffectation de fonctionnaires vers le terrain.", "date": "Programme 2027 en ligne (consulté le 3 octobre 2026)", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://www.unenouvelleenergie.fr/notre-programme/etre-maitre-de-notre-destin/", "cote": "A1"}]}, {"theme": "Social", "kw": "Travail", "short": "Au moins 500 € de plus pour le travail que pour les aides", "text": "Veut qu'un salarié à temps plein gagne au moins 500 euros de plus que le niveau d'aides sociales le plus élevé, selon son discours de Benfeld.", "date": "2026-09-25", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://www.unenouvelleenergie.fr/-benfeld-david-lisnard-appelle---librer-le-pays--devant-plus-de-1-200-personnes/", "cote": "A1"}]}, {"theme": "Social", "kw": "Retraites", "short": "Capitalisation obligatoire progressive en complément de la répartition", "text": "Propose d'introduire progressivement une part de capitalisation obligatoire à côté du système par répartition, présentée comme un « capitalisme populaire » ouvert aux Français modestes.", "date": "2026-09-29", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://unenouvelleenergie.fr/david-lisnard-aux-assises-de-lafer---tre-propritaire-cest-tre-libre-et-responsable-", "cote": "A1"}]}, {"theme": "Social", "kw": "Santé", "short": "Doubler le nombre d'étudiants en médecine d'ici 2030", "text": "Son livret santé propose de doubler le nombre d'étudiants formés d'ici 2030, d'alléger fiscalité et cotisations des médecins libéraux en zones sous-dotées et de recruter massivement des infirmières scolaires.", "date": "Mai 2026", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://nouvelle-energie-media-prod.s3.fr-par.scw.cloud/media/legacy/2026/05/Livret-Sante-Nouvelle-Energie.pdf", "cote": "A1"}]}, {"theme": "Immigration", "kw": "Titres de séjour", "short": "Délivrance de titres de séjour divisée par huit", "text": "Son programme prévoit de diviser par huit la délivrance de titres de séjour et d'expulser systématiquement les étrangers condamnés pour délits graves et les étrangers fichés S.", "date": "Programme 2027 en ligne (consulté le 3 octobre 2026)", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://www.unenouvelleenergie.fr/notre-programme/immigration/", "cote": "A1"}]}, {"theme": "Immigration", "kw": "Rétention", "short": "Rétention jusqu'à 24 mois, regroupement familial conditionné", "text": "Propose d'allonger la rétention administrative jusqu'à 24 mois, de conditionner le regroupement familial à des ressources et à un test d'intégration, et de traiter les demandes d'asile dans les consulats.", "date": "Programme 2027 en ligne (consulté le 3 octobre 2026)", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://www.unenouvelleenergie.fr/notre-programme/immigration/", "cote": "A1"}]}, {"theme": "Sécurité & ordre public", "kw": "Majorité pénale", "short": "Majorité pénale à 16 ans, fin des réductions automatiques de peine", "text": "Son programme propose d'abaisser la majorité pénale à 16 ans, d'inverser l'excuse de minorité dès 13 ans, de supprimer les réductions automatiques de peine et de doubler les effectifs des juridictions correctionnelles.", "date": "Programme 2027 en ligne (consulté le 3 octobre 2026)", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://www.unenouvelleenergie.fr/notre-programme/securite/", "cote": "A1"}]}, {"theme": "Sécurité & ordre public", "kw": "Tolérance zéro", "short": "Tolérance zéro et responsabilité des parents de mineurs délinquants", "text": "Après des violences lors des blocages de lycées à Cannes, défend une tolérance zéro, l'interpellation des auteurs et la mise en cause des responsables légaux des mineurs, rejetant la notion de responsabilité collective.", "date": "2026-09-29", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://www.unenouvelleenergie.fr/-cannes-face-aux-violences-david-lisnard-raffirme-la--tolrance-zro-/", "cote": "A1"}]}, {"theme": "Institutions & laïcité", "kw": "Septennat", "short": "Retour au septennat, rôles séparés des pouvoirs", "text": "Dans son discours de Bayeux, propose de rétablir le septennat, de séparer clairement les rôles du président, du gouvernement et de l'Assemblée, et de soumettre les grandes nominations à une majorité qualifiée.", "date": "2026-06-17", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://nouvelle-energie-media-prod.s3.fr-par.scw.cloud/media/legacy/2026/06/Discours-de-David-Lisnard-a-Bayeux-17062026.pdf", "cote": "A1"}]}, {"theme": "Institutions & laïcité", "kw": "Référendum", "short": "Référendum sans limite thématique, révision constitutionnelle directe", "text": "Veut lever les limites thématiques du référendum de l'article 11, permettre une révision de la Constitution par référendum et limiter le contrôle du Conseil constitutionnel à la lettre du texte.", "date": "2026-06-17", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://nouvelle-energie-media-prod.s3.fr-par.scw.cloud/media/legacy/2026/06/Discours-de-David-Lisnard-a-Bayeux-17062026.pdf", "cote": "A1"}]}, {"theme": "Institutions & laïcité", "kw": "Héritage chrétien", "short": "Héritage chrétien présenté comme fondement de l'universalisme républicain", "text": "Dans une tribune au Figaro reprise par son parti, soutient que tous les Français, croyants ou non, sont héritiers de la pensée chrétienne, fondement selon lui de l'universalisme républicain.", "date": "2026-09-28", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://www.unenouvelleenergie.fr/pourquoi-tous-les-franais-sont-les-hritiers-du-christianisme/", "cote": "A1"}]}, {"theme": "Institutions & laïcité", "kw": "Islamisme", "short": "Interdiction des Frères musulmans et du voile à l'université", "text": "Son programme sécurité propose d'interdire l'organisation des Frères musulmans, d'expulser les prédicateurs radicaux et d'interdire le port du voile à l'université.", "date": "Programme 2027 en ligne (consulté le 3 octobre 2026)", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://www.unenouvelleenergie.fr/notre-programme/securite/", "cote": "A1"}]}, {"theme": "Europe & international", "kw": "CEDH", "short": "Primauté de la loi française sur la CEDH, dérogations à la danoise", "text": "Propose de réviser l'article 55 de la Constitution pour faire primer la loi française sur la CEDH et de négocier des exemptions aux règles européennes d'asile et d'immigration sur le modèle danois.", "date": "2026-06-17", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://nouvelle-energie-media-prod.s3.fr-par.scw.cloud/media/legacy/2026/06/Discours-de-David-Lisnard-a-Bayeux-17062026.pdf", "cote": "A1"}]}, {"theme": "Europe & international", "kw": "Traités", "short": "Renégociation des traités, coopérations européennes par projets", "text": "Son programme prévoit de renégocier les traités pour rééquilibrer les pouvoirs vers le Conseil européen et le Parlement, et de renforcer les coopérations sur l'espace, le numérique et l'énergie décarbonée.", "date": "Programme 2027 en ligne (consulté le 3 octobre 2026)", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://www.unenouvelleenergie.fr/notre-programme/etre-maitre-de-notre-destin/", "cote": "A1"}]}, {"theme": "Europe & international", "kw": "Surtranspositions", "short": "Interdiction des surtranspositions de normes européennes", "text": "Lors de son meeting de Benfeld, propose d'interdire les surtranspositions des directives européennes dans le droit français, dans le cadre d'un programme de débureaucratisation.", "date": "2026-09-25", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://www.unenouvelleenergie.fr/-benfeld-david-lisnard-appelle---librer-le-pays--devant-plus-de-1-200-personnes/", "cote": "A1"}]}, {"theme": "Écologie & énergie", "kw": "Nucléaire", "short": "Prolongation des réacteurs à 60 ans, nouveaux EPR et petits réacteurs", "text": "Son programme prévoit de prolonger la durée de vie des réacteurs à 60 ans, de construire de nouveaux EPR, de déployer des petits réacteurs et d'instaurer un prix du carbone selon le principe pollueur-payeur.", "date": "Programme 2027 en ligne (consulté le 3 octobre 2026)", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://www.unenouvelleenergie.fr/notre-programme/generer-un-renouveau-civique/", "cote": "A1"}]}, {"theme": "Écologie & énergie", "kw": "Responsabilité", "short": "Principe de précaution remplacé par un principe de responsabilité", "text": "À Bayeux, propose de remplacer le principe de précaution par un principe de responsabilité et de retirer la Charte de l'environnement des normes de contrôle du Conseil constitutionnel.", "date": "2026-06-17", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://nouvelle-energie-media-prod.s3.fr-par.scw.cloud/media/legacy/2026/06/Discours-de-David-Lisnard-a-Bayeux-17062026.pdf", "cote": "A1"}]}, {"theme": "Éducation & jeunesse", "kw": "Enseignants", "short": "Salaires des enseignants +20 % en cinq ans, fin de la carte scolaire", "text": "Son programme prévoit une hausse de 20 % de la rémunération des enseignants en cinq ans, la suppression de la carte scolaire, un chèque-éducation et le recrutement des enseignants par les chefs d'établissement.", "date": "Programme 2027 en ligne (consulté le 3 octobre 2026)", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://www.unenouvelleenergie.fr/notre-programme/education/", "cote": "A1"}]}, {"theme": "Éducation & jeunesse", "kw": "Fondamentaux", "short": "Retour aux fondamentaux : mathématiques et raisonnement", "text": "Lors de son meeting de Benfeld, plaide pour un recentrage de l'école sur les mathématiques et le raisonnement critique, ainsi que pour un développement de l'éducation artistique et culturelle.", "date": "2026-09-25", "sources": [{"label": "Nouvelle Énergie (site officiel)", "url": "https://www.unenouvelleenergie.fr/-benfeld-david-lisnard-appelle---librer-le-pays--devant-plus-de-1-200-personnes/", "cote": "A1"}]}], "quotes": [{"theme": "Institutions & laïcité", "date": "2026-06-17", "text": "« Le Président présidera. Le Gouvernement gouvernera. L'Assemblée nationale légiférera. »", "context": "Dans son discours de Bayeux, il présente une réforme des institutions comprenant le retour au septennat et l'extension du référendum.", "source": {"label": "Nouvelle Énergie (site officiel)", "url": "https://nouvelle-energie-media-prod.s3.fr-par.scw.cloud/media/legacy/2026/06/Discours-de-David-Lisnard-a-Bayeux-17062026.pdf", "cote": "A1"}}, {"theme": "Institutions & laïcité", "date": "2026-09-28", "text": "« N'en déplaise aux fanatiques du laïcisme et autres bouffeurs de curés »", "context": "Dans une tribune parue dans Le Figaro, il soutient que tous les Français sont héritiers du christianisme.", "source": {"label": "Nouvelle Énergie (site officiel) – tribune parue dans Le Figaro", "url": "https://www.unenouvelleenergie.fr/pourquoi-tous-les-franais-sont-les-hritiers-du-christianisme/", "cote": "A1"}}, {"theme": "Sécurité & ordre public", "date": "2026-09-29", "text": "« Il n'y a pas de \"responsabilité collective\" »", "context": "Après des violences en marge des blocages de lycées à Cannes, il réaffirme une politique de tolérance zéro et la mise en cause des parents de mineurs délinquants.", "source": {"label": "Nouvelle Énergie (site officiel)", "url": "https://www.unenouvelleenergie.fr/-cannes-face-aux-violences-david-lisnard-raffirme-la--tolrance-zro-/", "cote": "A1"}}]}, "bertrand": {"positions": [{"theme": "Économie", "kw": "Dépense publique", "short": "20 Md€ d'économies par an pendant cinq ans, moins de fonctionnaires", "text": "Propose de réduire les dépenses publiques de 20 milliards d'euros par an pendant cinq ans et de baisser le nombre de fonctionnaires, sans créer d'impôt nouveau, selon L'Opinion.", "date": "2026-08-19", "sources": [{"label": "L'Opinion (article repris sur nousfrance.fr)", "url": "https://www.nousfrance.fr/2026/08/presidentielle-2027-xavier-bertrand-un-non-candidat-en-campagne-lopinion/", "cote": "B2"}]}, {"theme": "Économie", "kw": "Classes moyennes", "short": "Priorité aux classes moyennes, économies sur les dépenses sociales", "text": "Dit vouloir donner la priorité aux classes moyennes qui travaillent et sont à découvert en fin de mois, en faisant des économies partout où c'est possible, y compris sur les dépenses sociales.", "date": "2026-08-04", "sources": [{"label": "Le Figaro (article repris sur nousfrance.fr)", "url": "https://www.nousfrance.fr/2026/08/je-nai-pas-le-profil-dune-prise-de-guerre-je-trace-ma-route-le-pari-de-xavier-bertrand-pour-simposer-comme-candidat-de-la-droite-et-du-centre-le-figaro/", "cote": "B1"}, {"label": "LCP", "url": "https://lcp.fr/actualites/presidentielle-xavier-bertrand-indique-tester-ses-idees-et-envisager-de-concourir-en", "cote": "B1"}]}, {"theme": "Social", "kw": "Retraites", "short": "Âge légal repoussé, départ anticipé avec décote, capitalisation obligatoire", "text": "Veut repousser l'âge légal en lien avec l'allongement de la vie, permettre un départ anticipé avec décote, ajouter un étage de capitalisation obligatoire et abaisser l'âge d'annulation de la décote pour les femmes.", "date": "2026-08-19", "sources": [{"label": "L'Opinion (article repris sur nousfrance.fr)", "url": "https://www.nousfrance.fr/2026/08/presidentielle-2027-xavier-bertrand-un-non-candidat-en-campagne-lopinion/", "cote": "B1"}, {"label": "LCP", "url": "https://lcp.fr/actualites/presidentielle-xavier-bertrand-indique-tester-ses-idees-et-envisager-de-concourir-en", "cote": "B1"}]}, {"theme": "Social", "kw": "Pouvoir d'achat", "short": "Pouvoir d'achat en priorité de campagne", "text": "Lors d'un déplacement à Granville, présente le pouvoir d'achat comme une priorité de sa future campagne et cite les aides régionales des Hauts-de-France aux lycéens, salariés et parents.", "date": "2026-08-21", "sources": [{"label": "Ouest-France (article repris sur nousfrance.fr)", "url": "https://www.nousfrance.fr/2026/08/on-a-beaucoup-de-points-communs-entre-la-normandie-et-les-hauts-de-france-xavier-bertrand-de-passage-a-granville-ouest-france/", "cote": "B1"}, {"label": "Ouest-France (article repris sur nousfrance.fr)", "url": "https://www.nousfrance.fr/2026/08/xavier-bertrand-presque-candidat-a-la-presidentielle-ouest-france/", "cote": "B1"}]}, {"theme": "Sécurité & ordre public", "kw": "Protection civile", "short": "Protection civile modernisée : drones, sanctions des incendiaires", "text": "Veut adapter la protection civile aux nouveaux risques d'incendie avec davantage de surveillance, des drones de détection précoce, des sanctions sévères contre les incendiaires et le maintien du recrutement de pompiers.", "date": "2026-08-03", "sources": [{"label": "Var-Matin (article repris sur nousfrance.fr)", "url": "https://www.nousfrance.fr/2026/08/je-my-prepare-pas-encore-officiellement-candidat-xavier-bertrand-pose-les-bases-de-son-projet-pour-la-presidentielle-avec-la-culture-en-toile-de-fond-var-matin/", "cote": "B2"}]}, {"theme": "Institutions & laïcité", "kw": "Mandat unique", "short": "Un seul mandat présidentiel, retour du septennat", "text": "S'engage à n'effectuer qu'un seul mandat et propose de rétablir le septennat, par référendum selon Le Figaro ; Ouest-France rapporte toutefois un mandat unique de cinq ans.", "date": "2026-08-04", "sources": [{"label": "Le Figaro (article repris sur nousfrance.fr)", "url": "https://www.nousfrance.fr/2026/08/je-nai-pas-le-profil-dune-prise-de-guerre-je-trace-ma-route-le-pari-de-xavier-bertrand-pour-simposer-comme-candidat-de-la-droite-et-du-centre-le-figaro/", "cote": "B1"}, {"label": "L'Opinion (article repris sur nousfrance.fr)", "url": "https://www.nousfrance.fr/2026/08/presidentielle-2027-xavier-bertrand-un-non-candidat-en-campagne-lopinion/", "cote": "B1"}]}, {"theme": "Institutions & laïcité", "kw": "Territoires", "short": "République des territoires, pouvoir rendu aux élus locaux", "text": "Défend une « République des territoires » qui rendrait des compétences aux élus locaux et aux préfets, estimant que Paris s'occupe de trop de choses.", "date": "2026-08-03", "sources": [{"label": "Ouest-France (article repris sur nousfrance.fr)", "url": "https://www.nousfrance.fr/2026/08/xavier-bertrand-presque-candidat-a-la-presidentielle-ouest-france/", "cote": "B1"}, {"label": "Le Figaro (article repris sur nousfrance.fr)", "url": "https://www.nousfrance.fr/2026/08/je-nai-pas-le-profil-dune-prise-de-guerre-je-trace-ma-route-le-pari-de-xavier-bertrand-pour-simposer-comme-candidat-de-la-droite-et-du-centre-le-figaro/", "cote": "B1"}]}, {"theme": "Écologie & énergie", "kw": "Voiture électrique", "short": "Pas de taxation des voitures électriques", "text": "S'engage à ne pas taxer les voitures électriques s'il est élu, selon un article de L'Opinion consacré à sa précampagne.", "date": "2026-08-19", "sources": [{"label": "L'Opinion (article repris sur nousfrance.fr)", "url": "https://www.nousfrance.fr/2026/08/presidentielle-2027-xavier-bertrand-un-non-candidat-en-campagne-lopinion/", "cote": "B2"}]}, {"theme": "Éducation & jeunesse", "kw": "Culture à l'école", "short": "Chaque élève au contact d'une œuvre ; 1 % du budget pour la culture", "text": "Souhaite qu'aucun élève ne termine sa scolarité sans avoir rencontré une œuvre ou un spectacle, et propose de consacrer 1 % du budget de l'État à la culture d'ici 2032.", "date": "2026-08-03", "sources": [{"label": "Var-Matin (article repris sur nousfrance.fr)", "url": "https://www.nousfrance.fr/2026/08/je-my-prepare-pas-encore-officiellement-candidat-xavier-bertrand-pose-les-bases-de-son-projet-pour-la-presidentielle-avec-la-culture-en-toile-de-fond-var-matin/", "cote": "B1"}, {"label": "Le Parisien (article repris sur nousfrance.fr)", "url": "https://www.nousfrance.fr/2026/07/si-on-avait-superman-en-rayon-laffaire-serait-deja-pliee-face-a-marine-le-pen-xavier-bertrand-sy-voit-encore-le-parisien/", "cote": "B1"}]}], "quotes": [{"theme": "Institutions & laïcité", "date": "2026-08-04", "text": "« Faire barrage ou être un barrage, ce n'est pas un projet de société »", "context": "Dans Le Figaro, il dit refuser une candidature fondée sur la seule opposition au RN et se présente comme un candidat libre et indépendant.", "source": {"label": "Le Figaro (article repris sur nousfrance.fr)", "url": "https://www.nousfrance.fr/2026/08/je-nai-pas-le-profil-dune-prise-de-guerre-je-trace-ma-route-le-pari-de-xavier-bertrand-pour-simposer-comme-candidat-de-la-droite-et-du-centre-le-figaro/", "cote": "B2"}}, {"theme": "Institutions & laïcité", "date": "2026-09-07", "text": "« Je tiens à ma liberté »", "context": "À la braderie de Saint-Quentin, il explique vouloir déclarer sa candidature tardivement, avant la fin de l'année, et refuse toute primaire.", "source": {"label": "Le Figaro (article repris sur nousfrance.fr)", "url": "https://www.nousfrance.fr/2026/09/je-tiens-a-ma-liberte-a-la-braderie-de-saint-quentin-la-campagne-prudente-de-xavier-bertrand-figaro/", "cote": "B2"}}, {"theme": "Institutions & laïcité", "date": "2026-07-14", "text": "« Si on avait Superman en rayon, l'affaire serait déjà pliée »", "context": "Dans Le Parisien, il estime qu'aucun candidat ne parvient pour l'instant à contrer Marine Le Pen dans l'électorat populaire, et s'estime capable de la battre.", "source": {"label": "Le Parisien (article repris sur nousfrance.fr)", "url": "https://www.nousfrance.fr/2026/07/si-on-avait-superman-en-rayon-laffaire-serait-deja-pliee-face-a-marine-le-pen-xavier-bertrand-sy-voit-encore-le-parisien/", "cote": "B2"}}]}, "villepin": {"positions": [{"theme": "Économie", "kw": "Niches fiscales", "short": "Suppression d'environ 400 niches fiscales et sociales", "text": "Propose de supprimer environ 400 niches fiscales et sociales représentant près de 175 milliards d'euros par an et de ramener le code des impôts à 40 pages et neuf grands impôts.", "date": "2026-08-28", "sources": [{"label": "La France humaniste (site officiel)", "url": "https://lafrancehumaniste.fr/articles/big-bang-la-regle-republicaine.html", "cote": "A1"}]}, {"theme": "Économie", "kw": "Dette", "short": "Trajectoire pluriannuelle de déficit, plus de 120 Md€ d'effort d'ici 2031", "text": "Propose d'adopter dès le début du mandat une trajectoire de déficit sur cinq ans, avec plus de 120 milliards d'euros de hausses d'impôts et de baisses de dépenses ciblées d'ici 2031 pour repasser sous 3 %.", "date": "2026-08-21", "sources": [{"label": "La France humaniste (site officiel)", "url": "https://lafrancehumaniste.fr/articles/la-dette-cest-la-defaite.html", "cote": "A1"}]}, {"theme": "Économie", "kw": "Fonds souverain", "short": "Création d'un fonds souverain d'investissement", "text": "Propose un fonds souverain associant capitaux publics et privés, y compris l'épargne populaire, pour financer la réindustrialisation et la transformation du pays.", "date": "2026-08-21", "sources": [{"label": "La France humaniste (site officiel)", "url": "https://lafrancehumaniste.fr/articles/la-dette-cest-la-defaite.html", "cote": "A1"}]}, {"theme": "Social", "kw": "Salaires", "short": "Bascule de 200 Md€ de cotisations vers la CSG", "text": "Propose de transférer environ 200 milliards d'euros de cotisations salariales vers la CSG, ce qui augmenterait selon lui le salaire net d'environ 6 %, soit près de 90 euros par mois au Smic.", "date": "2026-08-28", "sources": [{"label": "La France humaniste (site officiel)", "url": "https://lafrancehumaniste.fr/articles/big-bang-la-regle-republicaine.html", "cote": "A1"}]}, {"theme": "Social", "kw": "Retraites", "short": "Conférence sociale et convention citoyenne, référendum si nécessaire", "text": "Propose d'organiser une conférence sociale sur les retraites associant une convention citoyenne et un débat parlementaire, conclue si nécessaire par un référendum.", "date": "2026-05-24", "sources": [{"label": "La France humaniste (site officiel)", "url": "https://lafrancehumaniste.fr/articles/chemin-gaulliste.html", "cote": "A1"}]}, {"theme": "Sécurité & ordre public", "kw": "Chaîne pénale", "short": "Défaillances de la chaîne pénale ; critique d'une cour de discipline des juges", "text": "Évoque des défaillances de la chaîne pénale et l'ampleur des violences sexuelles sur mineurs, tout en critiquant la proposition de Bruno Retailleau d'une juridiction disciplinaire pour les magistrats.", "date": "2026-06-07", "sources": [{"label": "La France humaniste (site officiel)", "url": "https://lafrancehumaniste.fr/articles/societe-en-guerre.html", "cote": "A1"}]}, {"theme": "Institutions & laïcité", "kw": "Gouvernement provisoire", "short": "Gouvernement provisoire dès l'élection, censure constructive", "text": "Propose de nommer dès son élection un gouvernement provisoire, de réunir un Conseil des territoires et d'instaurer une motion de censure constructive, avec si besoin plusieurs référendums par an.", "date": "2026-05-24", "sources": [{"label": "La France humaniste (site officiel)", "url": "https://lafrancehumaniste.fr/articles/chemin-gaulliste.html", "cote": "A1"}]}, {"theme": "Institutions & laïcité", "kw": "Laïcité", "short": "Laïcité d'apaisement fondée sur la loi de 1905", "text": "Défend une laïcité « de paix et d'équilibre » fondée sur la loi de 1905 et estime qu'elle est devenue une arme dirigée d'abord contre les citoyens de confession musulmane.", "date": "2026-09-26", "sources": [{"label": "La France humaniste (site officiel)", "url": "https://lafrancehumaniste.fr/articles/dieu-la-republique-et-nous.html", "cote": "A1"}]}, {"theme": "Institutions & laïcité", "kw": "Corse", "short": "Opposition à l'autonomie de la Corse, un seul peuple français", "text": "S'oppose au projet d'autonomie de la Corse au nom de l'unité de la République et veut traiter logement, saisonnalité et coût de la vie par des solutions nationales.", "date": "2026-06-16", "sources": [{"label": "La France humaniste (site officiel)", "url": "https://lafrancehumaniste.fr/articles/risque-identitaire-territoires.html", "cote": "A1"}]}, {"theme": "Europe & international", "kw": "Ormuz", "short": "Gouvernance internationale du détroit d'Ormuz", "text": "À propos du conflit entre les États-Unis et l'Iran, propose une gouvernance internationale du détroit d'Ormuz inspirée de la convention de Montreux et une coalition d'Européens et de pays du Sud.", "date": "2026-06-15", "sources": [{"label": "La France humaniste (site officiel)", "url": "https://lafrancehumaniste.fr/articles/guerre-americaine-paix-mondiale.html", "cote": "A1"}]}, {"theme": "Europe & international", "kw": "IA européenne", "short": "IA souveraine européenne financée par un consortium", "text": "Propose un modèle d'intelligence artificielle européen souverain financé par un consortium international de plusieurs centaines de milliards d'euros, et une autorité de sûreté de l'IA.", "date": "2026-06-13", "sources": [{"label": "La France humaniste (site officiel)", "url": "https://lafrancehumaniste.fr/articles/ia-pouvoir-de-dire-non-monopole-americain.html", "cote": "A1"}]}, {"theme": "Europe & international", "kw": "RN", "short": "Opposition à la « menace identitaire » du RN", "text": "Dit vouloir faire de 2027 le combat contre la « menace identitaire » du Rassemblement national et affirme qu'il n'a « jamais été de droite ».", "date": "2026-09-14", "sources": [{"label": "Brut", "url": "https://www.brut.media/fr/articles/presidentielle-dominique-de-villepin-affirme-avoir-toute-son-energie-tendue-vers-2027", "cote": "B3"}]}, {"theme": "Écologie & énergie", "kw": "Taxe carbone", "short": "Taxe carbone intégralement reversée aux ménages", "text": "Se définit comme « écogaulliste » et propose un prix du carbone intégralement rendu aux ménages, une électrification planifiée des usages et une politique de stockage et de partage de l'eau.", "date": "2026-06-28", "sources": [{"label": "La France humaniste (site officiel)", "url": "https://lafrancehumaniste.fr/articles/pourquoi-je-suis-ecogaulliste.html", "cote": "A1"}]}, {"theme": "Écologie & énergie", "kw": "Adaptation", "short": "Stratégie « France habitable 2050 »", "text": "Après les incendies de l'été, propose une stratégie « France habitable 2050 » contre chaleur et sécheresses, un programme de résilience des forêts et la modernisation des moyens de secours.", "date": "2026-07-24", "sources": [{"label": "La France humaniste (site officiel)", "url": "https://lafrancehumaniste.fr/articles/nous-sommes-cernes-par-les-flammes.html", "cote": "A1"}]}, {"theme": "Éducation & jeunesse", "kw": "Enseignants", "short": "+10 % pour les personnels, budget de l'Éducation sanctuarisé", "text": "Propose une hausse d'au moins 10 % des salaires de tous les personnels de l'école et la sanctuarisation du budget de l'Éducation nationale hors pensions.", "date": "2026-09-01", "sources": [{"label": "La France humaniste (site officiel)", "url": "https://lafrancehumaniste.fr/articles/refonder-lecole-pour-refaire-societe.html", "cote": "A1"}]}, {"theme": "Éducation & jeunesse", "kw": "Évaluations", "short": "Évaluations nationales annuelles, portable interdit à l'école", "text": "Propose des évaluations nationales annuelles en français, mathématiques et histoire du primaire au collège, l'interdiction du téléphone portable à l'école et des effectifs de classe fixés selon l'indice social.", "date": "2026-09-01", "sources": [{"label": "La France humaniste (site officiel)", "url": "https://lafrancehumaniste.fr/articles/refonder-lecole-pour-refaire-societe.html", "cote": "A1"}]}], "quotes": [{"theme": "Économie", "date": "2026-08-21", "text": "« La dette, c'est la défaite »", "context": "Dans une chronique de La France humaniste, il plaide pour un effort budgétaire de plus de 120 milliards d'euros d'ici 2031, en refusant à la fois la répudiation de la dette et le statu quo.", "source": {"label": "La France humaniste (site officiel)", "url": "https://lafrancehumaniste.fr/articles/la-dette-cest-la-defaite.html", "cote": "A1"}}, {"theme": "Institutions & laïcité", "date": "2026-09-26", "text": "« elle est d'abord une arme tournée contre nos concitoyens de confession musulmane »", "context": "Dans un texte sur la laïcité, il estime que celle-ci a été transformée en arme et défend la loi de 1905 comme une loi d'apaisement.", "source": {"label": "La France humaniste (site officiel)", "url": "https://lafrancehumaniste.fr/articles/dieu-la-republique-et-nous.html", "cote": "A1"}}, {"theme": "Europe & international", "date": "2026-09-14", "text": "« Je n'aurais aucun complexe à dire ce que je dois dire à la Chine »", "context": "Interrogé sur ses activités passées liées à la Chine et au Qatar, il répond aux critiques ; il revendique près de 50 000 adhérents pour La France humaniste.", "source": {"label": "Brut", "url": "https://www.brut.media/fr/articles/presidentielle-dominique-de-villepin-affirme-avoir-toute-son-energie-tendue-vers-2027", "cote": "B3"}}]}, "le-pen": {"positions": [{"theme": "Économie", "kw": "Dette", "short": "Plan de 125 milliards d'euros d'économies", "text": "Au débat organisé par le Medef, elle annonce un plan de 125 milliards d'euros d'économies pour rétablir les finances publiques, à présenter juste avant le débat budgétaire.", "date": "2026-08-27", "sources": [{"label": "LCP", "url": "https://lcp.fr/actualites/presidentielle-2027-ce-qu-il-faut-retenir-du-premier-debat-entre-les-candidats-440670", "cote": "B1"}, {"label": "Atlantico", "url": "https://atlantico.fr/article/decryptage/marine-le-pen-vs-sarah-knafo-le-match-des-milliards-deconomie-de-depenses-publiques", "cote": "C1"}]}, {"theme": "Immigration", "kw": "Logement social", "short": "Priorité nationale pour l'accès au logement social", "text": "Lors de sa rentrée politique à Hénin-Beaumont, elle place la « priorité nationale » au centre de sa campagne, avec un accès prioritaire des Français au logement social.", "date": "2026-09-13", "sources": [{"label": "Brussels Signal", "url": "https://brusselssignal.eu/2026/09/le-pen-puts-housing-and-national-priority-at-centre-of-campaign-launch/", "cote": "C3"}]}, {"theme": "Immigration", "kw": "Référendum", "short": "Référendum de révision constitutionnelle pour restreindre l'immigration", "text": "Selon une vérification d'Euronews, elle propose un référendum visant à modifier la Constitution pour restreindre l'immigration. Proposition antérieure à mai 2026, présentée comme toujours d'actualité en septembre 2026.", "date": "2026-09-17", "sources": [{"label": "Euronews", "url": "https://www.euronews.com/my-europe/2026/09/17/fact-check-will-marine-le-pen-hold-a-frexit-referendum-if-she-becomes-president-of-france", "cote": "B2"}]}, {"theme": "Institutions & laïcité", "kw": "Voile", "short": "Référendum sur l'interdiction du voile dans l'espace public", "text": "Elle propose un référendum pour interdire le port du voile dans l'espace public, présenté lors de son lancement de campagne à Hénin-Beaumont. Jordan Bardella se montre plus réservé sur ce thème selon Euronews.", "date": "2026-09-13", "sources": [{"label": "Euronews", "url": "https://www.euronews.com/my-europe/2026/09/13/le-pen-in-henin-beaumont-stronghold-for-damage-control", "cote": "B1"}, {"label": "Brussels Signal", "url": "https://brusselssignal.eu/2026/09/le-pen-puts-housing-and-national-priority-at-centre-of-campaign-launch/", "cote": "C1"}]}, {"theme": "Sécurité & ordre public", "kw": "Policiers", "short": "Peines exemplaires pour les agresseurs de policiers", "text": "Après l'agression filmée d'une policière en marge du blocage des lycées à Paris, elle juge les images insoutenables et réclame des peines exemplaires contre les auteurs.", "date": "2026-10-01", "sources": [{"label": "Le Journal du Dimanche (JDD)", "url": "https://www.lejdd.fr/Societe/tuez-la-une-policiere-attaquee-par-une-dizaine-de-jeunes-lors-dun-blocus-lyceen-a-paris-184977", "cote": "B3"}]}, {"theme": "Europe & international", "kw": "Ukraine", "short": "Fin de l'aide financière à l'Ukraine, maintien formation et matériel", "text": "Sur LCI, elle estime que la France ne peut plus aider financièrement l'Ukraine pour raisons budgétaires, mais peut continuer à former ses soldats et à lui fournir du matériel.", "date": "2026-09-16", "sources": [{"label": "Le Grand Continent", "url": "https://legrandcontinent.eu/fr/2026/09/28/marine-le-pen-peut-elle-vraiment-rompre-avec-poutine/", "cote": "B1"}, {"label": "Sud Radio", "url": "https://www.sudradio.fr/societe/le-rn-hausse-le-ton-face-a-la-russie-mais-est-accuse-de-double-discours", "cote": "C1"}, {"label": "The Kyiv Independent", "url": "https://kyivindependent.com/france-can-provide-defense-aid-to-ukraine-but-should-scale-back-financial-support-le-pen-says/", "cote": "B1"}]}, {"theme": "Europe & international", "kw": "Russie", "short": "Refus de toute ingérence russe dans la politique française", "text": "Dans un communiqué commun avec Jordan Bardella, elle déclare que la France ne tolérera pas qu'une puissance étrangère, la Russie, dicte sa politique par l'intimidation, après des actes de sabotage.", "date": "2026-09-19", "sources": [{"label": "Sud Radio", "url": "https://www.sudradio.fr/societe/le-rn-hausse-le-ton-face-a-la-russie-mais-est-accuse-de-double-discours", "cote": "C1"}, {"label": "Le Grand Continent", "url": "https://legrandcontinent.eu/fr/2026/09/28/marine-le-pen-peut-elle-vraiment-rompre-avec-poutine/", "cote": "B1"}]}, {"theme": "Europe & international", "kw": "Paix", "short": "Conférence internationale pour la paix pilotée par la France", "text": "Elle défend l'organisation par la France d'une grande conférence pour la paix sur la guerre en Ukraine, en positionnant le pays hors des blocs, selon Le Grand Continent.", "date": "Septembre 2026", "sources": [{"label": "Le Grand Continent", "url": "https://legrandcontinent.eu/fr/2026/09/28/marine-le-pen-peut-elle-vraiment-rompre-avec-poutine/", "cote": "B2"}]}, {"theme": "Europe & international", "kw": "UE", "short": "Réforme de l'UE de l'intérieur, sans référendum de sortie", "text": "Selon une vérification d'Euronews, elle ne propose pas de référendum de sortie de l'UE et défend depuis 2022 une transformation de l'Union en alliance plus souple de nations. Position antérieure, toujours en vigueur.", "date": "2026-09-17", "sources": [{"label": "Euronews", "url": "https://www.euronews.com/my-europe/2026/09/17/fact-check-will-marine-le-pen-hold-a-frexit-referendum-if-she-becomes-president-of-france", "cote": "B2"}]}, {"theme": "Écologie & énergie", "kw": "TVA énergie", "short": "TVA à 5,5 % sur carburants, électricité et gaz", "text": "Elle propose d'abaisser la TVA sur les carburants, l'électricité et le gaz de 20 % à 5,5 %, pour un coût estimé à 12-15 milliards d'euros par an selon 6Medias.", "date": "2026-09-21", "sources": [{"label": "Orange Actualités (6Medias)", "url": "https://actu.orange.fr/question-du-jour-2026-09-21-CNT000002s0few.html", "cote": "B1"}, {"label": "Brussels Signal", "url": "https://brusselssignal.eu/2026/09/le-pen-puts-housing-and-national-priority-at-centre-of-campaign-launch/", "cote": "C1"}]}], "quotes": [{"theme": "Europe & international", "date": "2026-09-16", "text": "« Mais financièrement, nous ne pouvons plus. »", "context": "Sur LCI, à propos de l'aide française à l'Ukraine, en précisant que la formation des soldats et la livraison de matériel pourraient continuer.", "source": {"label": "Sud Radio", "url": "https://www.sudradio.fr/societe/le-rn-hausse-le-ton-face-a-la-russie-mais-est-accuse-de-double-discours", "cote": "C1"}}, {"theme": "Europe & international", "date": "2026-09-24", "text": "« Soit l'OTAN entrera en guerre, et ce sera la Troisième Guerre mondiale »", "context": "Message publié sur les réseaux sociaux à propos de la poursuite du soutien à l'Ukraine ; elle évoque comme autre issue une guerre longue.", "source": {"label": "Le Grand Continent", "url": "https://legrandcontinent.eu/fr/2026/09/28/marine-le-pen-peut-elle-vraiment-rompre-avec-poutine/", "cote": "B2"}}, {"theme": "Sécurité & ordre public", "date": "2026-10-01", "text": "« poursuivie par une meute qui hurle sa haine »", "context": "Réaction à l'agression d'une policière en marge du blocage des lycées à Paris ; elle réclame des peines exemplaires.", "source": {"label": "Le Journal du Dimanche (JDD)", "url": "https://www.lejdd.fr/Societe/tuez-la-une-policiere-attaquee-par-une-dizaine-de-jeunes-lors-dun-blocus-lyceen-a-paris-184977", "cote": "B3"}}]}, "zemmour": {"positions": [{"theme": "Immigration", "kw": "Robots", "short": "Robotique et IA à la place de l'immigration de travail", "text": "Il propose de remplacer la main-d'œuvre immigrée par l'intelligence artificielle et la robotique, en citant les exemples chinois et japonais, notamment dans les secteurs jugés peu attractifs.", "date": "2026-09-13", "sources": [{"label": "Europe 1", "url": "https://www.europe1.fr/politique/presidentielle-2027-eric-zemmour-appelle-a-un-vote-du-sursaut-lors-de-son-discours-de-rentree-1075178", "cote": "B1"}, {"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/eric-zemmour-officialise-sa-candidature-a-la-presidentielle-2027", "cote": "B1"}]}, {"theme": "Immigration", "kw": "Remigration", "short": "« Remigration » et immigration négative plutôt qu'immigration zéro", "text": "Lors de son discours de rentrée au Port-Marly (Yvelines), il appelle à aller au-delà de l'immigration zéro, vers une « immigration négative », au nom de la « remigration ».", "date": "2026-09-13", "sources": [{"label": "Europe 1", "url": "https://www.europe1.fr/politique/presidentielle-2027-eric-zemmour-appelle-a-un-vote-du-sursaut-lors-de-son-discours-de-rentree-1075178", "cote": "B1"}, {"label": "Les Nouvelles Calédoniennes (dépêche AFP)", "url": "https://www.lnc.nc/article/presidentielle-eric-zemmour-confirme-qu-il-sera-candidat-et-durcit-encore-son-discours-sur-l-immigration", "cote": "B1"}]}, {"theme": "Économie", "kw": "IA", "short": "Investissements massifs et dérégulation pour l'intelligence artificielle", "text": "Il veut faire de la France le pays européen où il est le plus facile de créer une entreprise d'IA, avec des investissements massifs et une forte réduction des réglementations, pour devenir la troisième puissance mondiale de l'IA.", "date": "2026-09-13", "sources": [{"label": "Europe 1", "url": "https://www.europe1.fr/politique/presidentielle-2027-eric-zemmour-appelle-a-un-vote-du-sursaut-lors-de-son-discours-de-rentree-1075178", "cote": "B2"}]}, {"theme": "Économie", "kw": "Épargne", "short": "Mobilisation de l'épargne française et européenne pour l'investissement", "text": "Il propose de mobiliser l'épargne des Français et des Européens, évaluée à 37 000 milliards d'euros, pour financer l'investissement, notamment dans l'intelligence artificielle.", "date": "2026-09-13", "sources": [{"label": "Europe 1", "url": "https://www.europe1.fr/politique/presidentielle-2027-eric-zemmour-appelle-a-un-vote-du-sursaut-lors-de-son-discours-de-rentree-1075178", "cote": "B2"}]}, {"theme": "Écologie & énergie", "kw": "Nucléaire", "short": "Six EPR d'ici 2035, quatorze d'ici 2045", "text": "Lors de son discours de rentrée, il fixe un objectif de six réacteurs EPR construits d'ici 2035 et de quatorze d'ici 2045.", "date": "2026-09-13", "sources": [{"label": "Europe 1", "url": "https://www.europe1.fr/politique/presidentielle-2027-eric-zemmour-appelle-a-un-vote-du-sursaut-lors-de-son-discours-de-rentree-1075178", "cote": "B2"}]}, {"theme": "Écologie & énergie", "kw": "Électricité", "short": "Fin de la vente « bradée » de l'électricité française", "text": "Il promet que l'électricité produite en France « cessera d'être bradée », sans détail du mécanisme dans l'article d'Europe 1.", "date": "2026-09-13", "sources": [{"label": "Europe 1", "url": "https://www.europe1.fr/politique/presidentielle-2027-eric-zemmour-appelle-a-un-vote-du-sursaut-lors-de-son-discours-de-rentree-1075178", "cote": "B2"}]}], "quotes": [{"theme": "Immigration", "date": "2026-09-13", "text": "« Il faut la remigration »", "context": "Discours de rentrée au Port-Marly (Yvelines) devant environ 2 000 militants, où il défend une « immigration négative ».", "source": {"label": "Europe 1", "url": "https://www.europe1.fr/politique/presidentielle-2027-eric-zemmour-appelle-a-un-vote-du-sursaut-lors-de-son-discours-de-rentree-1075178", "cote": "B2"}}, {"theme": "Immigration", "date": "2026-09-17", "text": "« Des robots à la place des immigrés »", "context": "Sur BFMTV, en présentant le remplacement de la main-d'œuvre immigrée par l'automatisation, sur le modèle chinois et japonais.", "source": {"label": "Public Sénat", "url": "https://www.publicsenat.fr/actualites/politique/eric-zemmour-officialise-sa-candidature-a-la-presidentielle-2027", "cote": "B2"}}]}, "dupont-aignan": {"positions": [{"theme": "Europe & international", "kw": "UE", "short": "Sortie de l'Union européenne", "text": "Lors de sa Fête de la Liberté à Yerres, il propose de sortir de l'Union européenne pour rendre à la France le contrôle de ses frontières, de son budget, de sa monnaie et de ses lois.", "date": "2026-09-19", "sources": [{"label": "Site de campagne de Nicolas Dupont-Aignan", "url": "https://www.dupontaignan.fr/actualite/liberons-la-france-%c2%b7-discours-de-rentree-de-nicolas-dupont-aignan/", "cote": "A1"}]}, {"theme": "Europe & international", "kw": "OTAN", "short": "Sortie du commandement intégré de l'OTAN", "text": "Il propose que la France sorte à nouveau du commandement intégré de l'OTAN et construise une coopération européenne indépendante.", "date": "2026-09-19", "sources": [{"label": "Site de campagne de Nicolas Dupont-Aignan", "url": "https://www.dupontaignan.fr/actualite/liberons-la-france-%c2%b7-discours-de-rentree-de-nicolas-dupont-aignan/", "cote": "A1"}]}, {"theme": "Europe & international", "kw": "Ukraine", "short": "Arrêt des subventions à l'Ukraine ; neutralité négociée", "text": "Il veut arrêter toutes les subventions à l'Ukraine et négocier la fin du conflit sur un plan proche de celui de Donald Trump, avec neutralité et démilitarisation de l'Ukraine.", "date": "2026-09-21", "sources": [{"label": "Site de campagne de Nicolas Dupont-Aignan", "url": "https://www.dupontaignan.fr/actualite/president-jarreterai-toutes-subventions-a-lukraine-%c2%b7-bfmtv-21-09-26/", "cote": "A1"}, {"label": "Site de campagne de Nicolas Dupont-Aignan", "url": "https://www.dupontaignan.fr/actualite/liberons-la-france-%c2%b7-discours-de-rentree-de-nicolas-dupont-aignan/", "cote": "A1"}]}, {"theme": "Économie", "kw": "Industrie", "short": "Relocalisation de 2 millions d'emplois industriels, droits de douane sélectifs", "text": "Il propose de relocaliser 2 millions d'emplois industriels grâce à des droits de douane sélectifs et temporaires et à la baisse des impôts de production et des normes.", "date": "2026-09-19", "sources": [{"label": "Site de campagne de Nicolas Dupont-Aignan", "url": "https://www.dupontaignan.fr/actualite/liberons-la-france-%c2%b7-discours-de-rentree-de-nicolas-dupont-aignan/", "cote": "A1"}]}, {"theme": "Économie", "kw": "Commande publique", "short": "Part de 50 à 75 % de commande publique française", "text": "Il veut réserver 50 à 75 % de la commande publique à la production française et bloquer les investissements étrangers dans les secteurs stratégiques.", "date": "2026-09-19", "sources": [{"label": "Site de c   const byUrl = {}; Object.entries(S).forEach(([k, v]) => byUrl[v.url] = k);
  let n = 0;
  const key = src => {
    if (byUrl[src.url]) return byUrl[src.url];
    const k = "v" + (n++); S[k] = {label:src.label, url:src.url, cote:src.cote}; byUrl[src.url] = k; return k;
  };
  for (const [id, d] of Object.entries(VEILLE)){

    if (c.pending && c.programme.items.length >= 5) c.pending = false;

/* ---------- Utilitaires ---------- */
const app = document.getElementById("app");
const fmt = new Intl.DateTimeFormat("fr-FR", {day:"numeric", month:"long", year:"numeric"});
const fd = iso => fmt.format(new Date(iso + "T12:00:00"));
const dateText = o => o.dateLabel || (o.date ? fd(o.date) : "");
const sortKey = o => o.sort || o.date || "";
const statusLabel = c => STATUS[c.status][c.f ? "f" : "m"];

function el(tag, attrs = {}, ...kids){
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)){
    if (v === false || v == null) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return n;
}

/* Sources : entre parenthèses, lien cliquable, aucune URL visible */
function srcGroup(keys){
  const list = keys.map(k => { if (!S[k]) throw new Error("Source inconnue : " + k); return S[k]; });
  const out = ["("];
  list.forEach((s, i) => {
    if (i) out.push(", ");
    out.push(el("a", {class:"src", href:s.url, target:"_blank", rel:"noopener noreferrer", "aria-label":s.label + ", nouvel onglet"}, s.label));
  });
  out.push(")");
  return el("span", {}, out);
}
function rich(text){
  const out = []; const re = /\[\[([A-Za-z0-9_,]+)\]\]/g; let last = 0, m;
  while ((m = re.exec(text))){
    if (m.index > last) out.push(text.slice(last, m.index));
    out.push(srcGroup(m[1].split(",")));
    last = re.lastIndex;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}

const colorStyle = c => `--c:${c.c};--cd:${c.cd}`;
function avatar(c, size){
  const a = el("span", {class:"av", "aria-hidden":"true", style:size ? `--s:${size}` : null});
  if (c.photo){
    a.append(el("img", {src:c.photo, alt:""}));
  } else {
    a.append(c.ini);
  }
  return a;
}
const statusEl = c => el("span", {class:"status"}, el("span", {class:"mark m-" + c.status, "aria-hidden":"true"}), statusLabel(c));
const byId = id => CANDS.find(x => x.id === id);

/* ---------- Citations (fiche + vue globale) ---------- */
function quoteEl(q, showWho){
  const who = q.who;
  return el("figure", {class:"quote pc", style:colorStyle(who)},
    showWho ? el("div", {class:"who2"}, avatar(who), el("a", {href:"#" + who.id}, who.name)) : null,
    el("span", {class:"theme"}, q.theme),
    el("blockquote", {}, q.text),
    el("figcaption", {},
      el("div", {class:"line"}, el("span", {}, dateText(q)), srcGroup([q.source])),
      q.context ? el("p", {class:"ctx"}, q.context) : null
    )
  );
}

function quotesBlock(items, showWho){
  const root = el("div");
  const sorted = [...items].sort((a, b) => sortKey(b).localeCompare(sortKey(a)));
  const themes = [...new Set(sorted.map(q => q.theme))].sort((a, b) => a.localeCompare(b, "fr"));
  let active = null;
  const count = el("p", {class:"count", "aria-live":"polite"});
  const list = el("div", {class:"qlist"});
  const chips = el("div", {class:"chips", role:"group", "aria-label":"Filtrer par thème"});
  const mk = (label, theme) => el("button", {type:"button", class:"chip", "data-t":theme || "", "aria-pressed":"false", onclick:() => { active = theme; draw(); }}, label);
  function draw(){
    const shown = sorted.filter(q => !active || q.theme === active);
    list.replaceChildren(...shown.map(q => quoteEl(q, showWho)));
    count.textContent = shown.length + (shown.length > 1 ? " citations" : " citation");
    chips.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String((b.dataset.t || null) === active)));
  }
  if (themes.length > 1){
    chips.append(mk("Tous les thèmes", null), ...themes.map(t => mk(t, t)));
    root.append(chips);
  }
  root.append(count, list);
  draw();
  return root;
}

/* ---------- Panneaux de la fiche ---------- */
const shortCase = t => /^[A-ZÀ-Ý][a-zà-ÿ]/.test(t) && !/^(Europe|République|État|Smic)\b/.test(t) ? t[0].toLowerCase() + t.slice(1) : t;
function posItem(x){
  const meta = [dateText(x), srcKeys(x.text).filter(k => S[k] && S[k].cote).map(k => `${S[k].label} : ${S[k].cote}`).join(" · ")].filter(Boolean).join(" · Cotation ");
  if (!x.kw) return el("li", {class:"plain"}, el("p", {}, rich(x.text)), meta ? el("p", {class:"when"}, meta) : null);
  return el("li", {}, el("details", {},
    el("summary", {}, el("strong", {class:"kw"}, x.kw), " : ", shortCase(x.short)),
    el("div", {class:"pos-more"}, el("p", {}, rich(x.text)), el("p", {class:"when"}, meta))
  ));
}
function panelProgramme(c){
  const root = el("div");
  if (c.pending) root.append(el("p", {class:"pending"}, PENDING));
  if (c.programme.state) root.append(el("p", {class:"state"}, rich(c.programme.state)));
  root.append(el("h3", {}, "Positions annoncées"));
  if (!c.programme.items.length){
    root.append(el("p", {class:"empty"}, "Aucune position sourcée collectée pour l'instant."));
    return root;
  }
  const order = POS_THEMES.map(t => t[0]);
  const sorted = [...c.programme.items].sort((a, b) => sortKey(b).localeCompare(sortKey(a)));
  const count = t => sorted.filter(x => x.theme === t).length;
  const themes = [...new Set(sorted.map(x => x.theme).filter(Boolean))].sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));
  let active = null;
  const chips = el("div", {class:"chips big", role:"group", "aria-label":"Filtrer le programme par thème"});

function tabsFor(c){
  const defs = [
    ["programme", "Programme", () => panelProgramme(c)],
    ["actualite", "Actualité", () => panelNews(c)],
    ["citations", "Citations", () => panelQuotes(c)]
  ];
  const list = el("div", {class:"tabs", role:"tablist", "aria-label":"Rubriques de la fiche"});
  const wrap = el("div");
  const btns = [], pans = [];
  function select(i, focus){
    btns.forEach((b, j) => { b.setAttribute("aria-selected", String(i === j)); b.tabIndex = i === j ? 0 : -1; pans[j].hidden = i !== j; });
    if (focus) btns[i].focus();
  }
  defs.forEach(([id, label, build], i) => {
    const b = el("button", {type:"button", class:"tab", role:"tab", id:"tab-" + id, "aria-controls":"pan-" + id, onclick:() => select(i)}, label);
    b.addEventListener("keydown", e => {
      const k = e.key;
      if (k === "ArrowRight") { e.preventDefault(); select((i + 1) % defs.length, true); }
      else if (k === "ArrowLeft") { e.preventDefault(); select((i + defs.length - 1) % defs.length, true); }
      else if (k === "Home") { e.preventDefault(); select(0, true); }
      else if (k === "End") { e.preventDefault(); select(defs.length - 1, true); }
    });
    const p = el("div", {class:"panel", role:"tabpanel", id:"pan-" + id, "aria-labelledby":"tab-" + id, tabindex:"0"}, build());
    btns.push(b); pans.push(p); list.append(b); wrap.append(p);
  });
  select(0);
  return [list, wrap];
}

function renderQuiz(){
  document.title = "Quiz | Présidentielle 2027";
  const head = pageHead("Quiz : qui pense comme vous ?", "Des mesures précises défendues pendant la campagne. Vos réponses sont comparées aux positions sourcées des candidats relevées sur ce site.");
  const box = el("div", {class:"quiz"});
  app.replaceChildren(head, box);
  let QS = QUIZ, MIN_COMMON = 3, quick = true;
  const start = (q = quick) => { quick = q; QS = q ? QUIZ.filter(x => x.r) : QUIZ; MIN_COMMON = q ? 3 : 4; quizState = {i:0, a:Array(QS.length).fill(null)}; step(); };
  function intro(){
    box.replaceChildren(el("div", {class:"quiz-card"},
      el("ul", {class:"quiz-rules"},
        el("li", {}, "Répondez du tout d'accord au pas du tout d'accord, ou passez une question."),
        el("li", {}, "Le résultat ne porte que sur les positions publiques et sourcées des candidats. Un candidat qui ne s'est pas prononcé sur une question n'est pas comparé sur celle-ci."),
        el("li", {}, "Ce n'est pas une consigne de vote : c'est un point de départ pour lire les fiches."),
        el("li", {}, "Rien n'est enregistré ni envoyé. Tout se passe dans votre navigateur.")

      el("div", {class:"quiz-modes"},
        el("button", {type:"button", class:"qm", onclick:() => start(true)}, el("strong", {}, "Quiz rapide"), el("span", {}, QUIZ.filter(x => x.r).length + " questions · environ 3 minutes")),
        el("button", {type:"button", class:"qm", onclick:() => start(false)}, el("strong", {}, "Quiz complet"), el("span", {}, QUIZ.length + " questions · environ 8 minutes · plus précis"))
      )
    ));
  }
  function step(){
    const s = quizState, Q = QS[s.i];
    const prog = el("div", {class:"quiz-prog", role:"progressbar", "aria-valuemin":"0", "aria-valuemax":String(QS.length), "aria-valuenow":String(s.i)}, el("span", {style:`width:${s.i / QS.length * 100}%`}));
    box.replaceChildren(el("div", {class:"quiz-card"},
      prog,
      el("p", {class:"quiz-n"}, `Question ${s.i + 1} sur ${QS.length} · ${Q.t}`),
      el("h2", {class:"quiz-q", tabindex:"-1", id:"qq"}, Q.q),
      el("div", {class:"quiz-ans"}, ANSWERS.map(([v, l]) => el("button", {type:"button", class:"qa" + (s.a[s.i] === v ? " on" : ""), "data-v":String(v), onclick:() => { s.a[s.i] = v; next(); }}, l))),
      el("div", {class:"quiz-nav"},
        s.i ? el("button", {type:"button", class:"lnk", onclick:() => { s.i--; step(); }}, "‹ Question précédente") : el("span"),
        el("button", {type:"button", class:"lnk", onclick:() => { s.a[s.i] = null; next(); }}, "Passer ›")
      )
    ));
    document.getElementById("qq").focus({preventScroll:true});
  }
  function next(){ if (quizState.i < QS.length - 1){ quizState.i++; step(); } else results(); }
  function results(){
    const a = quizState.a;
    const rows = CANDS.map(c => {
      let sum = 0, n = 0; const det = [];

        const it = quizItem(c, st[1], st[2]); if (!it) return;
        const sc = a[i] !== null ? 1 - Math.abs(a[i] / 2 - st[0]) / 2 : null;
        if (sc !== null){ sum += sc; n++; }
        det.push({Q, i, st:st[0], it, u:a[i], sc});
      });
      return {c, n, pct:n ? Math.round(sum / n * 100) : null, adj:(sum + 1) / (n + 2), det};
    });
    const ok = rows.filter(r => r.n >= MIN_COMMON).sort((x, y) => y.adj - x.adj || y.n - x.n);
    const few = rows.filter(r => r.n < MIN_COMMON);
    const answered = a.filter(v => v !== null).length;
    const ansLabel = v => v === null ? "passée" : ANSWERS.find(x => x[0] === v)[1].toLowerCase();
    const detail = r => el("details", {class:"quiz-det"}, el("summary", {}, "Voir le détail"),
      el("ul", {}, r.det.map(d => el("li", {},
        el("p", {class:"qd-q"}, d.Q.q),

        el("span", {class:"rc-q"}, d.Q.q), " ",
        el("span", {class:"rc-u"}, "Vous : " + ansLabel(d.u) + "."), " ",
        el("span", {}, el("strong", {}, d.it.kw), " : ", shortCase(d.it.short), " ", srcGroup(srcKeys(d.it.text)))
      )))) : null;
    const recap = answered && ok.length ? el("section", {class:"quiz-recap"},
      el("h3", {}, "Récapitulatif : pourquoi ces candidats"),
      el("p", {class:"count"}, "Pour vos trois premiers résultats, les questions sur lesquelles vous êtes d'accord et celles sur lesquelles vous divergez, avec la position sourcée du candidat."),
      ok.slice(0, 3).map((r, k) => {
        const ag = r.det.filter(d => d.sc !== null && d.sc >= .75), dg = r.det.filter(d => d.sc !== null && d.sc <= .25);
        return el("article", {class:"rc pc", style:colorStyle(r.c)},
          el("div", {class:"qr-top"},
            el("span", {class:"qr-rank"}, String(k + 1)),
            el("a", {href:"#" + r.c.id, class:"qr-who"}, avatar(r.c), el("span", {}, el("strong", {}, r.c.name), el("small", {}, r.c.party))),
            el("span", {class:"qr-pct"}, r.pct + " %")
          ),
          el("p", {class:"rc-sum"}, `D'accord sur ${ag.length} question${ag.length > 1 ? "s" : ""}, en désaccord sur ${dg.length}, sur ${r.n} comparée${r.n > 1 ? "s" : ""}.`),
          why(ag, "Vous êtes d'accord sur", "ag"),
          why(dg, "Vous divergez sur", "dg"),
          !ag.length && !dg.length ? el("p", {class:"count"}, "Pas d'accord ni de désaccord net : vos réponses sont nuancées sur les questions où ce candidat s'est prononcé.") : null
        );
      })
    ) : null;
    box.replaceChildren(
      el("div", {class:"quiz-card quiz-res"},
        el("h2", {tabindex:"-1", id:"qq"}, answered ? "Vos résultats" : "Vous avez passé toutes les questions"),
        el("p", {class:"count"}, `${answered} réponse${answered > 1 ? "s" : ""} sur ${QS.length}. Le pourcentage indique votre accord avec les positions connues de chaque candidat, sur les questions où il s'est prononcé. À pourcentage proche, un candidat comparé sur plus de questions passe devant.`),
        answered ? el("ol", {class:"quiz-list"}, ok.map((r, k) => el("li", {class:"pc", style:colorStyle(r.c)},
          el("div", {class:"qr-top"},
            el("span", {class:"qr-rank"}, String(k + 1)),
            el("a", {href:"#" + r.c.id, class:"qr-who"}, avatar(r.c), el("span", {}, el("strong", {}, r.c.name), el("small", {}, r.c.party))),
            el("span", {class:"qr-pct"}, r.pct + " %")
          ),
          el("div", {class:"qr-bar"}, el("span", {style:`width:${r.pct}%`})),
          el("p", {class:"qr-n"}, `Comparé sur ${r.n} question${r.n > 1 ? "s" : ""}`),
          detail(r)
        ))) : null,
        recap,
        answered && few.length ? el("p", {class:"quiz-few"}, "Pas assez de positions connues pour comparer (moins de " + MIN_COMMON + " questions en commun avec vos réponses) : " + few.map(r => r.c.name).join(", ") + ".") : null,
        el("p", {class:"quiz-warn"}, "Ce résultat dépend des positions relevées à ce jour, qui sont incomplètes pour certains candidats. Il ne remplace pas la lecture des programmes."),
        el("div", {class:"cta"},
          el("button", {type:"button", class:"btn primary", onclick:() => start(quick)}, "Refaire ce quiz"),
          el("button", {type:"button", class:"btn", onclick:() => start(!quick)}, quick ? "Passer au quiz complet" : "Faire le quiz rapide"),
          el("a", {class:"btn", href:"#positions"}, "Comparer par thème")
        )
      )
    );
    document.getElementById("qq").focus({preventScroll:true});
    window.scrollTo(0, 0);
  }
  intro();
}

    el("a", {class:"back", href:"#candidats"}, "Tous les candidats"),
    el("div", {class:"fiche"}, side, main)
  );
  document.title = c.name + " | Présidentielle 2027";
}

function renderLegal(){
  document.title = "Mentions légales | Présidentielle 2027";
  app.replaceChildren(
    pageHead("Mentions légales", "Qui publie ce site, qui l'héberge et ce qu'il fait de vos données."),
    el("div", {class:"prose"},
      el("h2", {}, "Éditeur"),
      el("p", {}, "Site personnel et non commercial, édité par un particulier. Conformément à l'article 6, III, 2 de la loi n° 2004-575 du 21 juin 2004 (LCEN), son identité a été communiquée à l'hébergeur."),
      el("h2", {}, "Hébergeur"),
      el("p", {}, "GitHub, Inc. (GitHub Pages), 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, États-Unis."),
      el("h2", {}, "Données personnelles"),
      el("ul", {},
        el("li", {}, "Le site ne dépose aucun cookie et ne mesure pas l'audience."),
        el("li", {}, "Les réponses au quiz restent dans votre navigateur : elles ne sont ni enregistrées ni envoyées."),
        el("li", {}, "Les polices de caractères sont chargées depuis Google Fonts, qui reçoit à cette occasion l'adresse IP du visiteur, comme l'hébergeur.")
      ),
      el("h2", {}, "Contenus et crédits"),
      el("p", {}, "Les citations et positions sont courtes, attribuées et renvoient à leur source. Les photos des candidats proviennent de Wikimedia Commons et restent soumises à la licence indiquée sur leur page d'origine."),
      el("h2", {}, "Neutralité"),
      el("p", {}, "Ce site ne recommande aucun candidat et ne reçoit aucun financement de parti politique. Voir la ", el("a", {href:"#methode"}, "méthode"), ".")
    )
  );
}

const VIEWS = {"":["home", renderHome], accueil:["home", renderHome], candidats:["cands", renderCandidates], citations:["quotes", renderQuotes], themes:["pos", renderThemes], positions:["pos", renderPositions], quiz:["quiz", renderQuiz], calendrier:["cal", renderCalendar], methode:["method", renderMethod], mentions:["method", renderLegal]};
let first = true;
function route(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const c = byId(h);
  closeMenus();
  if (c){ buildMenu("cand"); renderCand(c); }
  else { const [key, fn] = VIEWS[h] || VIEWS[""]; buildMenu(key); fn(); }
  if (!first){
    window.scrollTo(0, 0);
    const t = document.getElementById("heading");
    (t || app).focus({preventScroll:true});
  }
  first = false;
}

const u = document.getElementById("upd");
u.textContent = fd(LAST_UPDATE);
u.setAttribute("datetime", LAST_UPDATE);
window.addEventListener("hashchange", route);
route();
</script>
